<title>YouTube + MP4 + Müzik Oynatıcı</title>
<style>
html, body {
    margin: 0; padding: 0; height: 100%; background: black; overflow: hidden;
}

/* Container */
#playerWrapper {
    position: fixed; top:0; left:0; width:100vw; height:100vh; overflow:hidden; background:black;
}

/* YouTube iframe & MP4 video */
#playerWrapper iframe, #playerWrapper video {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    min-width:100%; min-height:100%;
    object-fit:cover;
    transition: opacity 0.5s;
}

/* Butonlar */
.btn {
    position: fixed; z-index: 999;
    border: 2px solid white; border-radius: 50%; width: 60px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(4px);
    transition: transform 0.3s, opacity 0.5s;
    opacity: 1;
    background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
    background-size: 400% 400%;
    animation: btnRainbow 6s ease infinite;
}
.btn:hover { transform: scale(1.1); }
@keyframes btnRainbow { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }

#fullscreenBtn { bottom:20px; right:20px; top:auto; }
#musicBtn { bottom:20px; left:20px; top:auto; }
audio { display:none; }

/* Yükleme animasyonu */
#loadingOverlay {
    position: fixed; top:0; left:0; width:100vw; height:100vh; z-index:998;
    background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
    background-size:1400% 1400%;
    animation: rainbowMove 8s ease infinite;
}
@keyframes rainbowMove { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

.btn.hidden { opacity:0; pointer-events:none; }
</style>
</head>

const turkeySongs = ["Turku-Ervahi-Ezelden-14 (1).mp3","Erdal-Erzincan-Deyis.mp3"];

// YouTube player
let player, currentVideoId = null;
let autoSwitchEnabled = true, switchTimeout;

// MP4 transition video
const tv = document.getElementById("transitionVideo");

// Müzik çalar
const musicPlayer = document.getElementById("musicPlayer");
let musicIndex = Math.floor(Math.random()*turkeySongs.length);
musicPlayer.src = turkeySongs[musicIndex];
musicPlayer.addEventListener('ended',()=>{
  musicIndex=(musicIndex+1)%turkeySongs.length;
  musicPlayer.src = turkeySongs[musicIndex];
  musicPlayer.play();
});

// Butonlar
document.getElementById('fullscreenBtn').addEventListener('click',()=>{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); } 
    else{ document.exitFullscreen(); }
});
document.getElementById('musicBtn').addEventListener('click',()=>{
    if(musicPlayer.paused){ musicPlayer.play(); } else{ musicPlayer.pause(); }
});

// Buton gizle/göster
let hideTimeout;
function hideButtons(){ document.getElementById('fullscreenBtn').classList.add('hidden'); document.getElementById('musicBtn').classList.add('hidden'); }
function showButtons(){ 
    document.getElementById('fullscreenBtn').classList.remove('hidden'); 
    document.getElementById('musicBtn').classList.remove('hidden'); 
    clearTimeout(hideTimeout); 
    hideTimeout=setTimeout(hideButtons,20000); 
}
['mousemove','touchstart','pointerdown'].forEach(evt=>{
  document.addEventListener(evt,showButtons,{passive:true});
  document.getElementById('playerWrapper').addEventListener(evt,showButtons,{passive:true});
});
showButtons();

// Player resize
function resizePlayer(){
    const wrapper = document.getElementById('playerWrapper');
    const iframe = wrapper.querySelector('iframe');
    if(!iframe) return;
    const w = wrapper.offsetWidth, h = wrapper.offsetHeight;
    const ratio = 16/9, wrapperRatio = w/h;
    if(wrapperRatio>ratio){ iframe.style.width = (h*ratio)+'px'; iframe.style.height = h+'px'; }
    else{ iframe.style.width = w+'px'; iframe.style.height = (w/ratio)+'px'; }
}
window.addEventListener('resize',resizePlayer);

// YouTube API
function getRandomVideoId(){
  let id;
  do { id = videoIds[Math.floor(Math.random()*videoIds.length)]; } while(id===currentVideoId);
  return id;
}

function playNextVideo(){
  if(!autoSwitchEnabled) return;
  // MP4 transition
  tv.src = transitionVideos[Math.floor(Math.random()*transitionVideos.length)];
  tv.style.opacity=1;
  tv.currentTime=0;
  tv.play();

  setTimeout(()=>{
    tv.style.opacity=0;
    currentVideoId = getRandomVideoId();
    player.loadVideoById(currentVideoId);
    player.mute();
  }, 5000); // 5 saniye MP4 geçiş
}

function onPlayerReady(event){
  resizePlayer();
  player.setPlaybackQuality('highres');
  player.playVideo();
  switchTimeout=setInterval(playNextVideo,40000); // 40 saniye otomatik
  document.getElementById("loadingOverlay").style.display="none";
}

// YouTube API callback
function onYouTubeIframeAPIReady(){
  currentVideoId = getRandomVideoId();
  player = new YT.Player('player',{
      videoId: currentVideoId,
      playerVars:{autoplay:1,controls:0,mute:1,rel:0,playsinline:1},
      events:{onReady:onPlayerReady,onError:playNextVideo,onStateChange:(e)=>{ if(e.data===YT.PlayerState.ENDED) playNextVideo(); }}
  });
}

// Load YouTube API
const tag = document.createElement('script');
tag.src="https://www.youtube.com/iframe_api";
document.body.appendChild(tag);
