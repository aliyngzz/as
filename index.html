<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube + Müzik Oynatıcı (Tam Ekran)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    height: 100%;
    overflow: hidden;
  }
  #player {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
  }
  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .btn {
    position: fixed;
    z-index: 999;
    background: rgba(255,255,255,0.2);
    border: 2px solid white;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: transform 0.3s;
    color: white;
    font-size: 24px;
  }
  .btn:hover {
    transform: scale(1.1);
  }
  #fullscreenBtn {
    top: 20px;
    right: 20px;
  }
  #musicBtn {
    bottom: 20px;
    left: 20px;
  }
  audio {
    display: none;
  }
</style>
</head>
<body>

<div id="player"></div>

<div id="fullscreenBtn" class="btn">⛶</div>
<div id="musicBtn" class="btn">🎵</div>

<audio id="musicPlayer"></audio>

<script>
  // 3 tane örnek video ID
  const videoIds = ["RsdiBvgeGpg", "UHgF74ieHUM", "gf6SK0NObfI"];

  // 3 tane örnek müzik dosyası
  const turkeySongs = [
    "muzik1.mp3",
    "muzik2.mp3",
    "muzik3.mp3"
  ];

  let player;
  let videoTimer;

  function getRandomVideo() {
    return videoIds[Math.floor(Math.random() * videoIds.length)];
  }

  function playNextVideo() {
    player.loadVideoById(getRandomVideo());
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: getRandomVideo(),
      playerVars: { autoplay: 1, controls: 0, mute: 1, rel: 0, modestbranding: 1 },
      events: {
        'onReady': () => {
          startVideoRotation();
        },
        'onError': () => {
          playNextVideo(); // Bozuksa 1 saniye beklemeden geç
        },
        'onStateChange': (event) => {
          if (event.data === YT.PlayerState.ENDED) {
            playNextVideo();
          }
        }
      }
    });
  }

  function startVideoRotation() {
    clearInterval(videoTimer);
    videoTimer = setInterval(playNextVideo, 40000); // 40 saniye
  }

  // YouTube API script yükle
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // Tam ekran butonu
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // Müzik çalma
  const musicPlayer = document.getElementById('musicPlayer');
  let musicIndex = Math.floor(Math.random() * turkeySongs.length);
  musicPlayer.src = turkeySongs[musicIndex];

  musicPlayer.addEventListener('ended', () => {
    musicIndex = (musicIndex + 1) % turkeySongs.length;
    musicPlayer.src = turkeySongs[musicIndex];
    musicPlayer.play();
  });

  document.getElementById('musicBtn').addEventListener('click', () => {
    if (musicPlayer.paused) {
      musicPlayer.play();
    } else {
      musicPlayer.pause();
    }
  });
</script>

</body>
</html>
