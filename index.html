<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube + Müzik Oynatıcı</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: black;
  }

  /* Video alanı ve gökkuşağı arka plan */
  #player {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(
      270deg,
      #ff0000, #ff7f00, #ffff00,
      #00ff00, #0000ff, #4b0082, #8f00ff
    );
    background-size: 1200% 1200%;
    animation: rainbowBg 10s ease infinite;
    overflow: hidden;
  }

  #player iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 177.78vh;  /* 16:9 oran */
    height: 100vh;
    min-width: 100vw;
    min-height: 56.25vw;
  }

  @keyframes rainbowBg {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Butonlar */
  .btn {
    position: fixed;
    z-index: 999;
    border: 2px solid white;
    border-radius: 50%;
    width: 60px; height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: transform 0.3s, opacity 0.5s;
    opacity: 1;
    background: linear-gradient(
      270deg,
      #ff0000, #ff7f00, #ffff00,
      #00ff00, #0000ff, #4b0082, #8f00ff
    );
    background-size: 400% 400%;
    animation: btnRainbow 6s ease infinite;
  }

  .btn:hover { transform: scale(1.1); }

  @keyframes btnRainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #fullscreenBtn { bottom: 20px; right: 20px; top: auto; }
  #musicBtn { bottom: 20px; left: 20px; top: auto; }
  .btn.hidden { opacity: 0; pointer-events: none; }

  /* Yükleme ekranı */
  #loadingOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 998;
    background: linear-gradient(
      270deg,
      #ff0000, #ff7f00, #ffff00,
      #00ff00, #0000ff, #4b0082, #8f00ff
    );
    background-size: 1400% 1400%;
    animation: rainbowMove 8s ease infinite;
  }

  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  audio { display: none; }
</style>
</head>
<body>

<div id="loadingOverlay"></div>

<div id="player"></div>

<div id="fullscreenBtn" class="btn">⛶</div>
<div id="musicBtn" class="btn">🎵</div>

<audio id="musicPlayer" controls></audio>

<script>
  const videoIds = [
    "RsdiBvgeGpg","UHgF74ieHUM","gf6SK0NObfI","z_jyvAFOVj4",
    "0St2Vey_r1E","2_ovWpVE9es","jzx_n25g3kA","DHUnz4dyb54",
    "ECmjT2D1SzI","7w40FtLA4OQ","6Ad0iNbv54w","D1VM6V6wmU0"
    // Liste kısaltıldı, tüm ID’leri ekleyebilirsiniz
  ];

  const turkeySongs = [
    "Turku-Ervahi-Ezelden-14 (1).mp3",
    "Erdal-Erzincan-Deyis.mp3",
    "haci-bektas-i-veli-dergahindan-deyis-gel-aslin-sorarsan_(mp3tur.com).mp3",
    "ozlem-ozdil-kainatin-aynasiyim_(mp3tur.com).mp3"
  ];

  let player, videoTimer;

  function getRandomVideo() {
    return videoIds[Math.floor(Math.random() * videoIds.length)];
  }

  function playNextVideo() {
    clearInterval(videoTimer);
    player.loadVideoById(getRandomVideo());
    startVideoRotation();
  }

  function startVideoRotation() {
    clearInterval(videoTimer);
    videoTimer = setInterval(playNextVideo, 40000);
  }

  function onPlayerError() { playNextVideo(); }

  function onPlayerStateChange(event) {
    if(event.data === YT.PlayerState.ENDED) playNextVideo();
  }

  function onPlayerReady(event) {
    player.setPlaybackQuality('highres');
    player.playVideo();
    startVideoRotation();
    showButtons();
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function loadYouTubeAPI() {
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: getRandomVideo(),
      playerVars: { autoplay: 1, controls: 0, mute: 1, rel: 0, playsinline: 1 },
      events: {
        onReady: onPlayerReady,
        onError: onPlayerError,
        onStateChange: onPlayerStateChange
      }
    });
  }

  loadYouTubeAPI();

  // Tam ekran butonu
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  // Müzik çalar
  const musicPlayer = document.getElementById('musicPlayer');
  let musicIndex = Math.floor(Math.random() * turkeySongs.length);
  musicPlayer.src = turkeySongs[musicIndex];
  musicPlayer.addEventListener('ended', () => {
    musicIndex = (musicIndex + 1) % turkeySongs.length;
    musicPlayer.src = turkeySongs[musicIndex];
    musicPlayer.play();
  });
  document.getElementById('musicBtn').addEventListener('click', () => {
    if(musicPlayer.paused) musicPlayer.play(); else musicPlayer.pause();
  });

  // Buton gizle/göster
  let hideTimeout;
  function hideButtons() {
    document.getElementById('fullscreenBtn').classList.add('hidden');
    document.getElementById('musicBtn').classList.add('hidden');
  }
  function showButtons() {
    document.getElementById('fullscreenBtn').classList.remove('hidden');
    document.getElementById('musicBtn').classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(hideButtons, 20000);
  }

  ['mousemove','touchstart','pointerdown'].forEach(evt => {
    document.addEventListener(evt, showButtons, { passive: true });
    document.getElementById('player').addEventListener(evt, showButtons, { passive: true });
  });

  showButtons();
</script>

</body>
</html>
