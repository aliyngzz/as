<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doğa Sevgisi - Ali Yangöz</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 20px;
      color: white;
      background: #000;
      border: 2px solid white;
      cursor: pointer;
      z-index: 999;
    }

    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120vw;
      height: 67.5vw;
      max-height: 120vh;
      max-width: 213.33vh;
      z-index: 0;
    }

    #musicControl, #natureControl {
      position: fixed;
      bottom: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background: purple;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 1000;
    }

    #musicControl {
      left: 50%;
      transform: translateX(-50%);
    }

    #natureControl {
      left: 20px;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <button id="startBtn">EKRANA TIKLA - DOĞA VİDEO</button>
  <button id="musicControl">🎵 Müzik Aç</button>
  <button id="natureControl">🌲 Doğa Sesi Aç</button>

  <audio id="audioPlayer"></audio>
  <audio id="natureSound" preload="auto"></audio>

  <script>
    const videoIds = [
      "V08ET209nvU", "eT_W9pSC3mY", "17L1ahq27ro", "OteVW3af3BU", "Gd9d4q6WvUY",
      "sgtA6GUJk2I", "NqOmHpwMUxs", "FrULPuxyhWE", "V_I168MM-ik", "OYuD6HIxcXc"
    ];
    let videoIndex = 0;
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: videoIds[videoIndex],
        playerVars: {
          autoplay: 1,
          controls: 0,
          mute: 1,
          modestbranding: 1,
          rel: 0
        },
        events: {
          onReady: event => event.target.playVideo(),
          onError: skipToNext
        }
      });
    }

    function skipToNext() {
      videoIndex = (videoIndex + 1) % videoIds.length;
      player.loadVideoById(videoIds[videoIndex]);
    }

    document.getElementById("startBtn").onclick = () => {
      document.getElementById("startBtn").style.display = "none";
      onYouTubeIframeAPIReady();
    };

    const musicList = [
      "Erdal-Erzincan-Deyis.mp3",
      "mustafa-ozarslan-ayrilamam-ben-o-gul-yuzlu-yardan.mp3",
      "sabahat-akkiraz-tevhid.mp3"
    ];

    const musicBtn = document.getElementById("musicControl");
    const musicPlayer = document.getElementById("audioPlayer");
    let musicPlaying = false;
    let musicIndex = 0;

    musicBtn.onclick = () => {
      if (!musicPlaying) {
        musicPlayer.src = musicList[musicIndex];
        musicPlayer.play();
        musicBtn.textContent = "⏸ Müzik Kapat";
        musicPlaying = true;
      } else {
        musicPlayer.pause();
        musicBtn.textContent = "🎵 Müzik Aç";
        musicPlaying = false;
      }
    };

    musicPlayer.addEventListener("ended", () => {
      musicIndex = (musicIndex + 1) % musicList.length;
      musicPlayer.src = musicList[musicIndex];
      musicPlayer.play();
    });

    const natureSounds = [
      "birds-in-forest-on-sunny-day-14444.mp3",
      "forest-birds-summer-sweden-18333.mp3",
      "relaxing-rain-and-birds-6-minutes-52191.mp3"
    ];

    const natureBtn = document.getElementById("natureControl");
    const naturePlayer = document.getElementById("natureSound");
    let naturePlaying = false;

    natureBtn.onclick = () => {
      if (!naturePlaying) {
        const randomIndex = Math.floor(Math.random() * natureSounds.length);
        naturePlayer.src = natureSounds[randomIndex];
        naturePlayer.play();
        natureBtn.textContent = "⏸ Doğa Sesi Kapat";
        naturePlaying = true;
      } else {
        naturePlayer.pause();
        natureBtn.textContent = "🌲 Doğa Sesi Aç";
        naturePlaying = false;
      }
    };

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
