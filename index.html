<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube + MP4 + Müzik</title>
<style>
html, body { margin:0; padding:0; height:100%; background:black; overflow:hidden; }
#playerWrapper { position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; }
#playerWrapper iframe, #playerWrapper video {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  object-fit:cover; width:100%; height:100%;
  transition:opacity 0.5s;
}
#transitionVideo { opacity:1; }
#player iframe { opacity:0; }

/* Butonlar */
.btn { 
  position:fixed; z-index:999;
  border:2px solid white; border-radius:50%;
  width:60px; height:60px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(4px);
  transition: transform 0.3s, opacity 0.5s;
  opacity:1;
  background: linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);
  background-size:400% 400%;
  animation: rainbow 6s ease infinite;
  font-size:26px; color:white;
}
.btn:hover { transform:scale(1.1); }
@keyframes rainbow {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
#fullscreenBtn { bottom:20px; right:20px; }
#musicBtn { bottom:20px; left:20px; }
.btn.hidden { opacity:0; pointer-events:none; }

audio { display:none; }
</style>
</head>
<body>

<div id="playerWrapper">
  <div id="player"></div>
  <video id="transitionVideo" muted autoplay playsinline></video>
</div>

<!-- Butonlar -->
<div id="fullscreenBtn" class="btn">⛶</div>
<div id="musicBtn" class="btn">🎵</div>

<!-- Müzik çalar -->
<audio id="musicPlayer"></audio>

<script>
// --- YouTube video listesi ---
const videoIds = [
  "dQw4w9WgXcQ","3JZ_D3ELwOQ","9bZkp7q19f0","lY2yjAdbvdQ",
  "kJQP7kiw5Fk","fJ9rUzIMcZQ","JGwWNGJdvx8","JwYX52BP2Sk",
  "VzKL9oeJCI","03P6cS2SXIs","B4-L2nfGcuE","LCGYWfbyBWc",
  "ZQ5OqjssArE","LZSrqZ562Po","Sq-X4Ga1oyc","VUJbDTIYlM4",
  "2we-TrM7U1w","tEtg5Kg3voQ","fuCeRkeDxtQ","loHbMM9JfCs",
  "rnXIjl_Rzy4","iXLaEkB3J0I","5uZa3-RMFos","dp35ig7ZOZY",
  "8vTmL-oD3Lo","SZp1Q6LX7Wk","IAkRcsPDO8w","HjDvfp_vKwA",
  "FL1E0myLC8Y","xeUhuKpArJo","90ZXm5zNhRs","wEEJ7k5fL-g",
  "OrpQsDI2aQ8","LdJjVdgEd0E","vPhg6sc1Mk4","C2rQhlVuU7A",
  "daqB3i9WYIY","EmdtE7sRMSY","SLKYxiTR5UM","u6s-76xDTzQ",
  "G1rkqS7tnfo","FwbZM32VwLE","YEJVG8Xlgrs","SlHbrLj0dEM"
];

// --- MP4 listesi ---
const transitionVideos = [
  "205553-927347775_medium.mp4","284566_small.mp4",
  "13704-250154065_medium.mp4","188861-883827797_small.mp4",
  "2719-161687568_medium.mp4","141512-777708212_medium.mp4",
  "17925-286994396_medium.mp4","9734-221163205_medium.mp4",
  "14244-255658092_medium.mp4","163333-827461514_small.mp4",
  "165065-831695780_medium.mp4","168572-839370257_medium.mp4",
  "200427-912684284_small.mp4","205923_medium.mp4",
  "240320_small.mp4","292827_medium.mp4","c.mp4"
];

// --- Türkü listesi ---
const turkeySongs = [
  "Turku-Ervahi-Ezelden-14 (1).mp3","Erdal-Erzincan-Deyis.mp3",
  "haci-bektas-i-veli-dergahindan-deyis-gel-aslin-sorarsan.mp3",
  "ozlem-ozdil-kainatin-aynasiyim.mp3","Erdal-Erzincan-Yol-Havasi-87.mp3",
  "deyisler-ile-mustafa-ozarslan-yeni-yil-ozel-2024.mp3",
  "erdal-erzincan-bugun-pazar-i-asktir.mp3","Erdal-Erzincan-Sarma-Havasi-67.mp3",
  "sabahat-akkiraz-tevhid.mp3","kutsal-evcimen-harabat-ehliyiz.mp3"
];

// --- Global değişkenler ---
let player, currentVideoId = null;
const tv = document.getElementById("transitionVideo");
let autoSwitchEnabled = true;

// --- Müzik sistemi ---
const musicPlayer = document.getElementById("musicPlayer");
let musicIndex = Math.floor(Math.random()*turkeySongs.length);
musicPlayer.src = turkeySongs[musicIndex];
musicPlayer.volume = 0.7;
musicPlayer.play();

musicPlayer.addEventListener("ended",()=>{
  musicIndex = (musicIndex+1) % turkeySongs.length;
  musicPlayer.src = turkeySongs[musicIndex];
  musicPlayer.play();
});

// --- Butonlar ---
document.getElementById("fullscreenBtn").addEventListener("click",()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); }
  else{ document.exitFullscreen(); }
});
document.getElementById("musicBtn").addEventListener("click",()=>{
  if(musicPlayer.paused){ musicPlayer.play(); }
  else{ musicPlayer.pause(); }
});

// --- Buton gizleme/gösterme ---
let hideTimeout;
function hideButtons(){
  document.getElementById("fullscreenBtn").classList.add("hidden");
  document.getElementById("musicBtn").classList.add("hidden");
}
function showButtons(){
  document.getElementById("fullscreenBtn").classList.remove("hidden");
  document.getElementById("musicBtn").classList.remove("hidden");
  clearTimeout(hideTimeout);
  hideTimeout = setTimeout(hideButtons,20000);
}
["mousemove","touchstart","pointerdown"].forEach(evt=>{
  document.addEventListener(evt,showButtons,{passive:true});
});
showButtons();

// --- Video döngüsü ---
function getRandomVideoId(){
  let id;
  do { id = videoIds[Math.floor(Math.random()*videoIds.length)]; }
  while(id === currentVideoId);
  return id;
}

function playNextVideo(){
  if(!autoSwitchEnabled) return;

  // MP4 oynat
  tv.src = transitionVideos[Math.floor(Math.random()*transitionVideos.length)];
  tv.style.opacity = 1;
  tv.currentTime = 0;
  tv.play();

  const nextId = getRandomVideoId();
  setTimeout(()=>{
    currentVideoId = nextId;
    tv.style.opacity = 0;
    if(player){
      player.loadVideoById(nextId);
      player.playVideo();
      const iframe = document.querySelector('#player iframe');
      if(iframe) iframe.style.opacity = 1;
    }
  },6000);

  setTimeout(()=>{ if(autoSwitchEnabled) playNextVideo(); },26000);
}

function startCycle(){
  tv.src = transitionVideos[Math.floor(Math.random()*transitionVideos.length)];
  tv.style.opacity = 1;
  tv.play();

  const firstId = getRandomVideoId();
  currentVideoId = firstId;
  player = new YT.Player("player",{
    videoId:firstId,
    playerVars:{autoplay:0,controls:0,mute:1,rel:0,playsinline:1},
    events:{
      onReady:()=>{
        setTimeout(()=>{
          tv.style.opacity = 0;
          player.playVideo();
          const iframe = document.querySelector('#player iframe');
          if(iframe) iframe.style.opacity = 1;
        },6000);
        setTimeout(()=>{ if(autoSwitchEnabled) playNextVideo(); },26000);
      },
      onError:()=>{ playNextVideo(); }
    }
  });
}

// --- YouTube API ---
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);
function onYouTubeIframeAPIReady(){ startCycle(); }
</script>

</body>
</html>
