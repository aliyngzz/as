<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Geçiş Sistemi</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; color: white; font-family: Arial; }
    #playerFrame { width: 100vw; height: 100vh; border: none; }
    #noteText {
      position: absolute; bottom: 10px; left: 10px; width: 300px; height: 100px;
      background: rgba(0, 0, 0, 0.5); color: #fff; border: 1px solid #ccc; padding: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<iframe id="playerFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<textarea id="noteText" readonly></textarea>

<script>
const videoIds = [
  "V08ET209nvU", "eT_W9pSC3mY", "17L1ahq27ro", "OteVW3af3BU", "Gd9d4q6WvUY",
  "sgtA6GUJk2I", "NqOmHpwMUxs", "FrULPuxyhWE", "V_I168MM-ik", "OYuD6HIxcXc",
  "xBBRLWF0mM", "Lic2fD18wnw", "pW_S5RTdnSQ", "z6BNMoj9Pyo", "EoARdUpNjJ8",
  "aNxF7t9-HgI", "g4CmWNxgsic", "LCGYWfbyBWc", "Fw9hgttWzIg", "RmP5eN7gQ6A",
  "CcnlJI_UXyM", "hFr5w9KLEA4", "DsNtwGJXTTs", "FrULPuxyhWE", "Li3Dvqlo5uE",
  "wBVq_Qoegmo", "1nVFCfRlqRo", "oHbMM9JfCs", "Ftm3QRR0YV0", "IIPvs--98sc",
  "daqB3i9WYIY", "3xGg1HJ8cso", "H8UO0sJvWDw", "czoEAKX9aaM", "D1VM6V6wmU0",
  "EvsLqQS_80E", "8pvXU1aEQZ0", "djEyd01KpNU", "0St2Vey_r1E", "5F0dNX7sFzU",
  "SUXX8nC7RoM", "7uLRpG2c_Eg", "6Ad0iNbv54w", "798qd_SQU3I", "FzdXt1drdp0",
  "mnCOp-xmpCo", "E5T2eHM8tcI", "7w40FtLA4OQ", "ECmjT2D1SzI", "yalfhK84SNU",
  "F0GOOP82094", "qGfqox0CSrI", "4kRzwJXaeIM", "mIPHBwY5aS0", "DHUnz4dyb54",
  "jzx_n25g3kA"
];

let currentIndex = 0;
let nextVideoReady = false;
let nextIndex = null;

function playVideo(index) {
  const videoId = videoIds[index];
  currentIndex = index;
  nextVideoReady = false;
  nextIndex = null;

  const iframe = document.getElementById("playerFrame");
  iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1`;

  // 10. saniyede sıradaki video test edilir
  setTimeout(() => {
    prepareNextValidVideo(index + 1);
  }, 10000);

  // 20. saniyede geçiş hazırsa yapılır
  setTimeout(() => {
    if (nextVideoReady && nextIndex !== null) {
      playVideo(nextIndex);
    } else {
      waitUntilNextReady();
    }
  }, 20000);
}

function prepareNextValidVideo(startIndex) {
  const testId = videoIds[startIndex];
  if (!testId) return;

  const testIframe = document.createElement("iframe");
  testIframe.src = `https://www.youtube.com/embed/${testId}?enablejsapi=1&autoplay=1`;
  testIframe.style.display = "none";
  document.body.appendChild(testIframe);

  let success = false;

  setTimeout(() => {
    success = true;
    nextVideoReady = true;
    nextIndex = startIndex;
    testIframe.remove();
  }, 1000);

  setTimeout(() => {
    if (!success) {
      document.getElementById("noteText").value += `\nBozuk video: ${testId}`;
      testIframe.remove();
      prepareNextValidVideo(startIndex + 1);
    }
  }, 1500);
}

function waitUntilNextReady() {
  const kontrol = setInterval(() => {
    if (nextVideoReady && nextIndex !== null) {
      clearInterval(kontrol);
      playVideo(nextIndex);
    }
  }, 1000);
}

// Başlangıçta ilk videoyu başlat
window.onload = () => {
  playVideo(currentIndex);
};
</script>

</body>
</html>
