<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doğa TV | Müzik & Video Deneyimi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video, iframe {
      display: block;
    }

    #mp4Player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #ytPlayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      transition: opacity .8s ease;
      z-index: 2;
      pointer-events: none;
    }

    #ytPlayer.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <video id="mp4Player" muted autoplay loop playsinline></video>
  <div id="ytPlayer"></div>

  <script>
    const videoIds = [
      "t20fPDAZxCA","gf6SK0NObfI","z_jyvAFOVj4","0St2Vey_r1E","2_ovWpVE9es",
      "jzx_n25g3kA","DHUnz4dyb54","ECmjT2D1SzI","7w40FtLA4OQ","6Ad0iNbv54w",
      "D1VM6V6wmU0","czoEAKX9aaM","hFr5w9KLEA4","Fw9hgttWzIg","4BrvMGznLTo",
      "dXIyMS61B68","x10vL6_47Dw","OYuD6HIxcXc","W3D3dEpR3bs","VzKL9oeJCI",
      "03P6cS2SXIs","F0GOOP82094","B4-L2nfGcuE","LCGYWfbyBWc","ZQ5OqjssArE",
      "LZSrqZ562Po","Sq-X4Ga1oyc","VUJbDTIYlM4","2we-TrM7U1w","oBTGY6Ax870",
      "RNKg_XD84UM","tEtg5Kg3voQ","fuCeRkeDxtQ"
    ];

    const mp4Videos = [
      "158349-816637197_tiny.mp4","246856_tiny.mp4","120739-724673230_tiny.mp4",
      "28746-371345147_tiny.mp4","57647-486227472_tiny.mp4","35427-407130886_small.mp4",
      "263208_small.mp4","242228_small.mp4","180057-863401699_small.mp4",
      "159309-818469332.mp4","144959-785568576_medium.mp4","6847-196978755_medium.mp4",
      "16012-268207204_small.mp4","228847_tiny.mp4","71350-538489808.mp4",
      "71571-538974136.mp4","854982-hd_1280_720_25fps.mp4","107027-674703679_medium.mp4",
      "113004-696349232_medium.mp4","114552-701830169_tiny.mp4","145059-785786266_medium.mp4",
      "155242-809619008_tiny.mp4","resim.mp4","170727-843752865_tiny.mp4",
      "178807-860734626_medium.mp4","178809-860734631_small.mp4",
      "184261-873087820_tiny.mp4","189703-886596102_medium.mp4",
      "198416-907598367_tiny.mp4","201446-915698703_medium.mp4",
      "5744426-hd_1280_720_30fps.mp4","44798-440001069_small.mp4",
      "186405-877993676_tiny.mp4","214732_tiny.mp4","3904-175596530_medium.mp4",
      "184972-874460313_medium.mp4","133101-755975121_medium.mp4"
    ];

    function uniqShuffle(arr){
      return [...new Set(arr)].sort(() => Math.random() - 0.5);
    }

    let ytList = uniqShuffle(videoIds);
    let mp4List = uniqShuffle(mp4Videos);
    let ytIndex = 0;
    let mp4Index = 0;

    const mp4 = document.getElementById('mp4Player');
    const ytDiv = document.getElementById('ytPlayer');
    let ytPlayer, ytReady = false;

    function playNextMp4() {
      if (mp4Index >= mp4List.length) {
        mp4List = uniqShuffle(mp4Videos);
        mp4Index = 0;
      }
      mp4.src = mp4List[mp4Index++];
      mp4.play().catch(() => {});
    }

    function loadYouTubeAPI() {
      const s = document.createElement('script');
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }

    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player('ytPlayer', {
        videoId: '',
        playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, modestbranding: 1, mute: 1 },
        events: {
          onReady: () => { ytReady = true; startSequence(); },
          onStateChange: handleState,
          onError: () => skipBadYouTube()
        }
      });
    };

    function handleState(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        ytDiv.classList.add('active');
        mp4.pause();
        mp4.style.display = 'none';
      } else if (e.data === YT.PlayerState.ENDED) {
        nextYouTube();
      }
    }

    function skipBadYouTube() {
      setTimeout(() => {
        if (ytPlayer.getPlayerState() !== YT.PlayerState.PLAYING) {
          nextYouTube();
          mp4.style.display = 'block';
          playNextMp4();
        }
      }, 1000);
    }

    function nextYouTube() {
      ytIndex = (ytIndex + 1) % ytList.length;
      ytPlayer.loadVideoById(ytList[ytIndex]);
      ytDiv.classList.remove('active');
    }

    function startSequence() {
      mp4.style.display = 'block';
      playNextMp4();
      ytPlayer.loadVideoById(ytList[ytIndex]);
      skipBadYouTube();
    }

    loadYouTubeAPI();
  </script>

</body>
</html>
