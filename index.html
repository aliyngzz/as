<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sadece Sağlam Video Göster</title>
  <style>
    body { margin: 0; background: black; }
    #playerFrame { width: 100vw; height: 100vh; border: none; display: none; }
    #noteText {
      position: fixed; top: 10px; left: 10px; width: 300px; height: 150px;
      background: rgba(255,255,255,0.9); padding: 10px; font-size: 12px; z-index: 1000;
    }
  </style>
</head>
<body>
  <textarea id="noteText" placeholder="Bozuk videolar buraya yazılır..."></textarea>
  <iframe id="playerFrame" allow="autoplay" allowfullscreen></iframe>

  <script>
    const videoIds = [
      "V08ET209nvU", "eT_W9pSC3mY", "17L1ahq27ro", "OteVW3af3BU", "Gd9d4q6WvUY",
      "sgtA6GUJk2I", "NqOmHpwMUxs", "FrULPuxyhWE", "V_I168MM-ik", "OYuD6HIxcXc",
      "xBBRLWF0mM", "Lic2fD18wnw", "pW_S5RTdnSQ", "z6BNMoj9Pyo", "EoARdUpNjJ8",
      "aNxF7t9-HgI", "g4CmWNxgsic", "LCGYWfbyBWc", "Fw9hgttWzIg", "RmP5eN7gQ6A",
      "CcnlJI_UXyM", "hFr5w9KLEA4", "DsNtwGJXTTs", "Li3Dvqlo5uE", "wBVq_Qoegmo",
      "1nVFCfRlqRo", "oHbMM9JfCs", "Ftm3QRR0YV0", "IIPvs--98sc", "daqB3i9WYIY",
      "3xGg1HJ8cso", "H8UO0sJvWDw", "czoEAKX9aaM", "D1VM6V6wmU0", "EvsLqQS_80E",
      "8pvXU1aEQZ0", "djEyd01KpNU", "0St2Vey_r1E", "5F0dNX7sFzU", "SUXX8nC7RoM"
    ];

    let currentIndex = 0;

    function testVideo(index) {
      if (index >= videoIds.length) {
        alert("Hiç geçerli video bulunamadı.");
        return;
      }

      const testId = videoIds[index];
      const test = document.createElement("iframe");
      test.style.display = "none";
      test.src = `https://www.youtube.com/embed/${testId}?autoplay=1&mute=1&enablejsapi=1`;

      document.body.appendChild(test);

      setTimeout(() => {
        const blocked = !test.contentWindow || test.contentDocument?.body?.innerHTML.includes("www.youtube.com/404") || test.contentDocument?.body?.innerText.includes("This video is unavailable");
        
        if (blocked) {
          document.getElementById("noteText").value += `\nBozuk video: ${testId}`;
          test.remove();
          testVideo(index + 1); // sonraki videoya geç
        } else {
          showMainVideo(testId);
          test.remove();
        }
      }, 1500); // 1.5 saniyede bozuksa anlaşılıyor
    }

    function showMainVideo(videoId) {
      const player = document.getElementById("playerFrame");
      player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&enablejsapi=1`;
      player.style.display = "block";
    }

    // Sayfa yüklenince sağlam videoyu bul
    window.onload = () => {
      testVideo(0);
    };
  </script>
</body>
</html>
