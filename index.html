<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ali'nin Doğa Sayfası</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #startBtn {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 20px;
      background: #000;
      color: white;
      border: 2px solid white;
      cursor: pointer;
      z-index: 9999;
    }

    .player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vw;
      height: 67.5vw;
      max-height: 120vh;
      max-width: 213.33vh;
      transform: translate(-50%, -50%);
      z-index: 0;
      opacity: 0;
      transition: opacity 2s ease;
      pointer-events: none;
    }

    .player.active {
      opacity: 1;
      pointer-events: auto;
    }

    #musicControl, #play-sound, #pause-sound {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 9999;
    }
    #pause-sound { left: 180px; display: none; }

    #tvOpenBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 30px;
      font-size: 18px;
      background: linear-gradient(135deg, #ff4081, #7c4dff);
      color: white;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      z-index: 9999;
    }

    #miniTVContainer {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 320px;
      height: 180px;
      background: black;
      border: 2px solid white;
      display: none;
      flex-direction: column;
      z-index: 999;
    }

    #miniTV {
      width: 100%;
      height: 100%;
      border: none;
    }

    #closeTVBtn {
      position: absolute;
      top: -10px;
      right: -10px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      box-shadow: 0 0 10px #fff;
      font-weight: bold;
    }

    #weather-box {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 9999;
    }

    #sloganText {
      position: fixed;
      top: 10px;
      width: 100%;
      text-align: center;
      font-size: 28px;
      color: #fff;
      text-shadow: 0 0 10px #00ffcc;
      z-index: 9999;
      opacity: 0;
      transition: opacity 2s ease;
    }
  </style>
</head>
<body>

<button id="startBtn">EKRANI TIKLA | DOĞA İZLE | MÜZİK DİNLE | TV İZLE</button>
<audio id="audioPlayer"></audio>
<audio id="natureSound"></audio>
<div id="player1" class="player"></div>
<div id="player2" class="player"></div>
<div id="sloganText">ALİ YANGÖZ DOĞAYI SEVİYOR YA SİZ?</div>

<!-- Müzik ve doğa sesi kontrol -->
<button id="musicControl">🎵 Müziği Aç</button>
<button id="play-sound">🌿 Doğa Sesi Aç</button>
<button id="pause-sound">🌿 Doğa Sesi Kapat</button>

<!-- TV -->
<button id="tvOpenBtn">📺 TV Aç</button>
<div id="miniTVContainer">
  <iframe id="miniTV" src="https://www.youtube.com/embed/ztmY_cCtUl0" allowfullscreen></iframe>
  <button id="closeTVBtn">✕</button>
</div>

<!-- Hava durumu -->
<div id="weather-box">Yükleniyor...</div>

<script>
const videoIds = [
  "V08ET209nvU", "eT_W9pSC3mY", "17L1ahq27ro", "OteVW3af3BU",
  "Gd9d4q6WvUY", "sgtA6GUJk2I", "NqOmHpwMUxs", "FrULPuxyhWE",
  "V_I168MM-ik", "OYuD6HIxcXc", "xBBRLWF0mM", "Lic2fD18wnw"
];

const turkeySongs = [
  "Erdal-Erzincan-Yara-Bende-yeni-2.mp3",

</script>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let players = {}, index = 0, activePlayer = 1;
function onYouTubeIframeAPIReady() {
  players.player1 = new YT.Player('player1', { videoId: '', events: { onReady: () => startVideoPlayer() }, playerVars: { autoplay: 1, controls: 0, mute: 1 } });
  players.player2 = new YT.Player('player2', { videoId: '', playerVars: { autoplay: 0, controls: 0, mute: 1 } });
}
function startVideoPlayer() {
  loadVideo(players.player1, videoIds[index], 'player1');
  scheduleNext();
}
function loadVideo(player, videoId, divId) {
  const div = document.getElementById(divId);
  div.classList.remove("active");
  let tryCount = 0;
  try {
    player.loadVideoById(videoId);
    const check = setInterval(() => {
      if (player.getPlayerState() === 1) { clearInterval(check); div.classList.add("active"); }
      else if (++tryCount >= 3) { clearInterval(check); skipToNext(); }
    }, 1000);
  } catch { skipToNext(); }
}
function scheduleNext() {
  const next = (index + 1) % videoIds.length;
  const nextPlayer = activePlayer === 1 ? players.player2 : players.player1;
  const nextDiv = activePlayer === 1 ? 'player2' : 'player1';
  const currentDiv = activePlayer === 1 ? 'player1' : 'player2';
  setTimeout(() => loadVideo(nextPlayer, videoIds[next], nextDiv), 30000);
  setTimeout(() => {
    document.getElementById(currentDiv).classList.remove("active");
    document.getElementById(nextDiv).classList.add("active");
    index = next; activePlayer = activePlayer === 1 ? 2 : 1;
    scheduleNext();
  }, 40000);
}
function skipToNext() {
  index = (index + 1) % videoIds.length;
  const player = activePlayer === 1 ? players.player1 : players.player2;
  const div = activePlayer === 1 ? 'player1' : 'player2';
  loadVideo(player, videoIds[index], div);
}
</script>

<script>
let musicIndex = 0;
const musicPlayer = document.getElementById("audioPlayer");
const musicBtn = document.getElementById("musicControl");
let isPlaying = false;
musicBtn.onclick = () => {
  if (!isPlaying) {
    musicPlayer.src = turkeySongs[musicIndex];
    musicPlayer.play();
    musicBtn.textContent = "⏸ Müziği Kapat";
  } else {
    musicPlayer.pause();
    musicBtn.textContent = "🎵 Müziği Aç";
  }
  isPlaying = !isPlaying;
};
musicPlayer.onended = () => {
  musicIndex = (musicIndex + 1) % turkeySongs.length;
  musicPlayer.src = turkeySongs[musicIndex];
  musicPlayer.play();
};
</script>

<script>
const playBtn = document.getElementById("play-sound");
const pauseBtn = document.getElementById("pause-sound");
const natureSound = document.getElementById("natureSound");
playBtn.onclick = () => {
  natureSound.src = natureSounds[Math.floor(Math.random() * natureSounds.length)];
  natureSound.play();
  playBtn.style.display = "none";
  pauseBtn.style.display = "inline-block";
};
pauseBtn.onclick = () => {
  natureSound.pause();
  natureSound.currentTime = 0;
  pauseBtn.style.display = "none";
  playBtn.style.display = "inline-block";
};
</script>

<script>
const tvOpenBtn = document.getElementById("tvOpenBtn");
const miniTVContainer = document.getElementById("miniTVContainer");
const closeTVBtn = document.getElementById("closeTVBtn");
tvOpenBtn.onclick = () => {
  miniTVContainer.style.display = "flex";
  tvOpenBtn.style.display = "none";
};
closeTVBtn.onclick = () => {
  miniTVContainer.style.display = "none";
  tvOpenBtn.style.display = "block";
};
</script>

<script>
const cities = ["Kutahya", "Ankara", "Izmir", "Istanbul"];
let cityIndex = 0;
const weatherBox = document.getElementById("weather-box");
async function fetchWeather(city) {
  try {
    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},TR&units=metric&lang=tr&appid=77fe7ca2c5710d0b9e4b56b12b6b679e`);
    const data = await res.json();
    weatherBox.innerHTML = `<b>${data.name}</b><br>${data.weather[0].description}<br>${Math.round(data.main.temp)}°C<br><img src='https://openweathermap.org/img/wn/${data.weather[0].icon}.png'>`;
  } catch (e) {
    weatherBox.innerHTML = "Hava durumu alınamadı.";
  }
}
function updateWeather() {
  fetchWeather(cities[cityIndex]);
  cityIndex = (cityIndex + 1) % cities.length;
}
setInterval(updateWeather, 5000);
updateWeather();
</script>

<script>
setTimeout(() => document.getElementById("startBtn").style.display = "block", 3000);
document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("startBtn").style.display = "none";
  enterFullscreen(document.documentElement);
  startVideoPlayer();
});
function enterFullscreen(el) {
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}
</script>

<script>
function showSlogan() {
  const s = document.getElementById("sloganText");
  s.style.opacity = 1;
  setTimeout(() => s.style.opacity = 0, 20000);
}
setTimeout(showSlogan, 1000);
setInterval(showSlogan, 240000);
</script>
