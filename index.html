<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doğa Sever Sistemi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    .player {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .player.active {
      opacity: 1;
      pointer-events: auto;
    }
    .player iframe {
      width: 100%; height: 100%; border: none; visibility: hidden;
    }
    .player.active iframe {
      visibility: visible;
    }
    #mp4Player {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: none;
      z-index: -1;
    }
    #musicControl {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-size: 16px;
      z-index: 1000;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #nature-controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    #nature-controls button {
      padding: 10px;
      font-size: 14px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="player1" class="player"></div>
<div id="player2" class="player"></div>
<video id="mp4Player" muted autoplay loop></video>

<button id="musicControl">🎵 Türkü Aç</button>
<div id="nature-controls">
  <button id="play-sound">Doğa Sesini Aç</button>
  <button id="pause-sound" style="display:none;">Doğa Sesini Kapat</button>
</div>
<audio id="audioPlayer"></audio>
<audio id="nature-sound"></audio>

<script>
let players = {};
let index = 0;
let activePlayer = 1;
let currentMp4Index = 0;
const badVideoIds = JSON.parse(localStorage.getItem("badVideoIds")) || [];

const videoIds = ["eT_W9pSC3mY", "B4-L2nfGcuE", "ZQ5OqjssArE"];
const mp4Videos = ["video1.mp4", "video2.mp4", "yedek.mp4"];
const turkeySongs = ["turku1.mp3", "turku2.mp3", "sabahat.mp3"];
const natureSounds = ["kus.mp3", "orman.mp3", "dere.mp3"];

let tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  players.player1 = new YT.Player('player1', {
    videoId: '',
    events: {
      onReady: () => startVideoPlayer(),
      onError: (e) => handleError(e, 'player1')
    },
    playerVars: { autoplay: 1, controls: 0, mute: 1 }
  });

  players.player2 = new YT.Player('player2', {
    videoId: '',
    events: {
      onError: (e) => handleError(e, 'player2')
    },
    playerVars: { autoplay: 0, controls: 0, mute: 1 }
  });
}

function startVideoPlayer() {
  const validList = getValidVideos();
  if (validList.length === 0) return playMp4Fallback();
  shuffleArray(validList);
  index = 0;
  loadVideo(players.player1, validList[index], 'player1');
  scheduleNext(validList);
}

function loadVideo(player, videoId, divId) {
  isYouTubeEmbeddable(videoId, function (canPlay) {
    if (!canPlay) {
      logBadVideo(videoId);
      playMp4Fallback();
      skipToNext();
      return;
    }

    const div = document.getElementById(divId);
    div.classList.remove("active");
    div.style.opacity = "0";
    div.style.display = "none";

    try {
      player.loadVideoById(videoId);
      player.mute();
      let attempts = 0;
      const checker = setInterval(() => {
        if (player.getPlayerState() === 1) {
          clearInterval(checker);
          div.classList.add("active");
          div.style.opacity = "1";
          div.style.display = "block";
          stopMp4();
        } else if (++attempts > 10) {
          clearInterval(checker);
          logBadVideo(videoId);
          playMp4Fallback();
          skipToNext();
        }
      }, 100);
    } catch (e) {
      logBadVideo(videoId);
      playMp4Fallback();
      skipToNext();
    }
  });
}

function scheduleNext(validList) {
  const nextIndex = (index + 1) % validList.length;
  const nextPlayer = activePlayer === 1 ? players.player2 : players.player1;
  const nextDiv = activePlayer === 1 ? 'player2' : 'player1';
  const currentDiv = activePlayer === 1 ? 'player1' : 'player2';

  setTimeout(() => {
    loadVideo(nextPlayer, validList[nextIndex], nextDiv);
  }, 10000);

  setTimeout(() => {
    document.getElementById(currentDiv).classList.remove("active");
    document.getElementById(currentDiv).style.display = "none";
    document.getElementById(nextDiv).classList.add("active");
    document.getElementById(nextDiv).style.display = "block";
    index = nextIndex;
    activePlayer = activePlayer === 1 ? 2 : 1;
    scheduleNext(validList);
  }, 15000);
}

function playMp4Fallback() {
  document.querySelectorAll('.player').forEach(div => {
    div.classList.remove("active");
    div.style.opacity = "0";
    div.style.display = "none";
  });

  const mp4 = document.getElementById("mp4Player");
  if (currentMp4Index >= mp4Videos.length) {
    shuffleArray(mp4Videos);
    currentMp4Index = 0;
  }
  mp4.src = mp4Videos[currentMp4Index++];
  mp4.style.display = "block";
  mp4.play();
  mp4.onended = () => playMp4Fallback();
}

function stopMp4() {
  const mp4 = document.getElementById("mp4Player");
  mp4.pause();
  mp4.style.display = "none";
}

function logBadVideo(id) {
  if (!badVideoIds.includes(id)) {
    badVideoIds.push(id);
    localStorage.setItem("badVideoIds", JSON.stringify(badVideoIds));
  }
}

function getValidVideos() {
  return videoIds.filter(id => !badVideoIds.includes(id));
}

function isYouTubeEmbeddable(videoId, callback) {
  const iframe = document.createElement("iframe");
  iframe.style.display = "none";
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=0`;
  document.body.appendChild(iframe);
  const timeout = setTimeout(() => {
    document.body.removeChild(iframe);
    callback(false);
  }, 1000);
  iframe.onload = () => {
    clearTimeout(timeout);
    document.body.removeChild(iframe);
    callback(true);
  };
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function skipToNext() {
  const validList = getValidVideos();
  index = (index + 1) % validList.length;
  loadVideo(players[`player${activePlayer}`], validList[index], `player${activePlayer}`);
}

// Türkü Müzik Sistemi
let musicIndex = 0;
let isPlaying = false;
const musicPlayer = document.getElementById("audioPlayer");
const musicButton = document.getElementById("musicControl");
let shuffled = shuffleArray([...turkeySongs]);

function playNextTurku() {
  musicPlayer.src = shuffled[musicIndex];
  musicPlayer.play();
}
musicPlayer.addEventListener("ended", () => {
  musicIndex = (musicIndex + 1) % shuffled.length;
  playNextTurku();
});
musicButton.addEventListener("click", () => {
  if (!isPlaying) {
    playNextTurku();
    musicButton.textContent = "⏸ Türkü Kapat";
    isPlaying = true;
  } else {
    musicPlayer.pause();
    musicButton.textContent = "🎵 Türkü Aç";
    isPlaying = false;
  }
});

// Doğa Sesi Sistemi
const natureAudio = document.getElementById("nature-sound");
const playBtn = document.getElementById("play-sound");
const pauseBtn = document.getElementById("pause-sound");

playBtn.addEventListener("click", () => {
  const rand = Math.floor(Math.random() * natureSounds.length);
  natureAudio.src = natureSounds[rand];
  natureAudio.play();
  playBtn.style.display = "none";
  pauseBtn.style.display = "inline-block";
});
pauseBtn.addEventListener("click", () => {
  natureAudio.pause();
  natureAudio.currentTime = 0;
  pauseBtn.style.display = "none";
  playBtn.style.display = "inline-block";
});
</script>

</body>
</html>
