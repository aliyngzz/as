<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Tek Menü Kontrol Sistemi</title>
  <style>
    /* Sayfa Temel Stil */
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Ana Menü Butonu */
    #mainMenuBtn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border: 2px solid white;
      cursor: pointer;
      z-index: 9999;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }

    #mainMenuBtn:hover {
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 0 30px rgba(255,255,255,0.8);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 10px rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 20px rgba(255,255,255,0.8); }
      100% { box-shadow: 0 0 10px rgba(255,255,255,0.4); }
    }

    #mainMenuBtn img {
      width: 50%;
      height: 50%;
    }

    /* Alt Menü */
    #subMenu {
      position: fixed;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 9998;
    }

    .subMenuBtn {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      cursor: pointer;
      transition: all 0.3s;
    }

    .subMenuBtn:hover {
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.05);
    }

    /* Mevcut TV, not kutusu ve diğer sistemlerin tasarımını koruyoruz */
    #tvDiv, #noteDiv {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      display: none;
      z-index: 9000;
    }
  </style>
</head>

<body>

  <!-- Ana Menü Butonu -->
  <div id="mainMenuBtn">
    <img src="home.png" alt="Menu">
  </div>

  <!-- Alt Menü Butonları -->
  <div id="subMenu">
    <button class="subMenuBtn" id="musicBtn">🎼 Müzik</button>
    <button class="subMenuBtn" id="soundBtn">🌿 Doğa Sesi</button>
    <button class="subMenuBtn" id="tvBtn">📺 TV</button>
    <button class="subMenuBtn" id="noteBtn">📝 Not</button>
  </div>

  <!-- TV ve Not kutusu örneği -->
  <div id="tvDiv">TV Açıldı (örnek)</div>
  <div id="noteDiv">Not Paneli (örnek)</div>

  <!-- Ses kaynakları örnek -->
  <audio id="natureAudio" loop>
    <source src="nature.mp3" type="audio/mp3">
  </audio>

  <audio id="musicAudio" loop>
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <script>
    const mainMenuBtn = document.getElementById("mainMenuBtn");
    const subMenu = document.getElementById("subMenu");
    let menuOpen = false;

    mainMenuBtn.addEventListener("click", () => {
      menuOpen = !menuOpen;
      subMenu.style.display = menuOpen ? "flex" : "none";
    });

    // Müzik kontrol
    const musicAudio = document.getElementById("musicAudio");
    let musicPlaying = false;
    document.getElementById("musicBtn").addEventListener("click", () => {
      if (musicPlaying) {
        musicAudio.pause();
      } else {
        musicAudio.play();
      }
      musicPlaying = !musicPlaying;
    });

    // Doğa sesi kontrol
    const natureAudio = document.getElementById("natureAudio");
    let naturePlaying = false;
    document.getElementById("soundBtn").addEventListener("click", () => {
      if (naturePlaying) {
        natureAudio.pause();
      } else {
        natureAudio.play();
      }
      naturePlaying = !naturePlaying;
    });

    // TV kontrol
    const tvDiv = document.getElementById("tvDiv");
    document.getElementById("tvBtn").addEventListener("click", () => {
      tvDiv.style.display = tvDiv.style.display === "none" ? "block" : "none";
    });

    // Not kontrol
    const noteDiv = document.getElementById("noteDiv");
    document.getElementById("noteBtn").addEventListener("click", () => {
      noteDiv.style.display = noteDiv.style.display === "none" ? "block" : "none";
    });
  </script>

</body>
</html>
