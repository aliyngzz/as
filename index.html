<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğa ve Müzik Keyfi</title>
    <style>
        /* Temel Sıfırlamalar ve Genel Ayarlar */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Sayfa kaydırmasını engeller */
            background: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* Giriş Resmi Ekranı */
        #introImage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Resmin yolu doğru olduğundan emin olun */
            background: url('pexels-pixabay-158063.jpg') no-repeat center center / cover;
            z-index: 1000; /* Diğer her şeyin üstünde */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            opacity: 1;
            transition: opacity 1s ease-out; /* Yumuşak geçiş */
        }

        /* Geri Sayım Ekranı */
        #countdownScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10000; /* En üstte olmalı */
            display: none; /* Başlangıçta gizli */
        }
        #countdown {
            font-size: 6em;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        #message {
            font-size: 1.5em;
            margin-top: 20px;
            color: #ccc;
        }

        /* Başlat Butonu */
        #startBtn {
            display: none; /* JS ile görünür yapılacak */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
            color: white;
            cursor: pointer;
            animation: glow 3s linear infinite;
            box-shadow: 0 0 15px #fff;
            z-index: 100; /* Her zaman üstte olsun */
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px #ff00cc; }
            25% { box-shadow: 0 0 20px #3333ff; }
            50% { box-shadow: 0 0 20px #00ffcc; }
            75% { box-shadow: 0 0 25px #ffcc00; }
            100% { box-shadow: 0 0 10px #ff00cc; }
        }

        /* Video Oynatıcı Konteynerleri */
        .player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120vw; /* Biraz taşma efekti için */
            height: 67.5vw; /* 16:9 oranı (120 * 9 / 16) */
            max-height: 120vh; /* Dikey olarak ekranın max yüksekliği */
            max-width: 213.33vh; /* Yatay olarak ekranın max genişliği (120 * 16 / 9) */
            transform: translate(-50%, -50%);
            z-index: 0;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none; /* Etkileşimi engelle, click olaylarını pas geçer */
        }

        .player.active {
            opacity: 1;
            pointer-events: auto; /* Aktifken etkileşime izin ver */
        }

        .player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Kapat Butonu */
        #closeBtn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-weight: bold;
            padding: 12px 25px;
            border: 2px solid white;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: none; /* Başlangıçta gizli */
            animation: shine 2s ease-in-out infinite;
            z-index: 9999; /* Diğer her şeyin üstünde olsun */
        }

        @keyframes shine {
            0% { box-shadow: 0 0 5px white; }
            50% { box-shadow: 0 0 20px white; }
            100% { box-shadow: 0 0 5px white; }
        }

        /* Slogan Metni */
        #sloganText {
            position: fixed;
            top: 10px;
            width: 100%;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow:
                0 0 5px #00ffcc,
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc;
            z-index: 9999;
            opacity: 0;
            transition: opacity 2s ease;
            font-family: 'Arial Black', Gadget, sans-serif;
        }

        /* Müzik Kontrol Butonu */
        #musicControl {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #8e24aa, #5e35b1);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 9999;
        }

        #musicControl:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Doğa Sesleri Kontrol Butonları */
        #nature-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            display: flex;
            gap: 10px;
            backdrop-filter: blur(4px);
        }

        #nature-controls button {
            padding: 8px 14px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #2e7d32;
            color: white;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        #nature-controls button:hover {
            background-color: #4CAF50;
        }

        /* Mini TV ekranı ve butonları */
        #miniTVContainer {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 300px;
            height: 170px; /* 16:9 oranı için yaklaşık (300 * 9 / 16) */
            background: black;
            border: 2px solid white;
            display: flex;
            flex-direction: column;
            z-index: 20;
            display: none; /* Başlangıçta gizli */
        }

        #miniTV {
            width: 100%;
            height: 100%;
            border: none;
        }

        #tvControls {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }

        .tvBtn {
            background: #222;
            color: white;
            border: 1px solid white;
            cursor: pointer;
            padding: 5px;
            flex: 1;
            font-size: 12px;
            margin: 0 2px;
        }

        #tvOpenBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4081, #7c4dff);
            color: white;
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            z-index: 9999;
            display: none; /* Başlangıçta gizli */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #tvOpenBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        }

        /* Not ve Alarm Paneli */
        #notTrigger {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 30px;
            text-align: center;
            line-height: 60px;
            cursor: pointer;
            box-shadow: 0 0 15px #fff;
            animation: pulse 2s infinite;
            z-index: 1000;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px #fff; }
            50% { box-shadow: 0 0 20px #f0f; }
            100% { box-shadow: 0 0 10px #fff; }
        }

        #notPanel {
            position: fixed;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            background: #222;
            color: #fff;
            border-radius: 15px;
            padding: 15px;
            width: 250px;
            box-shadow: 0 0 20px #0ff;
            display: none; /* Başlangıçta gizli */
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        #noteText {
            height: 80px;
            border: none;
            border-radius: 8px;
            padding: 8px;
            resize: vertical; /* Yalnızca dikey olarak yeniden boyutlandırılsın */
            font-size: 14px;
            background-color: #333;
            color: white;
            outline: none; /* Odaklandığında kenarlık olmasın */
        }

        #alarmTime {
            border-radius: 8px;
            padding: 5px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            outline: none;
        }

        #notPanel button {
            background: linear-gradient(45deg, #74ebd5, #9face6);
            border: none;
            border-radius: 8px;
            padding: 8px;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #notPanel button:hover {
            background: #fff;
        }

        /* Hava Durumu Kutusu */
        #weather-box {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6); /* Hafif şeffaf arkaplan */
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 14px;
            width: 160px;
            line-height: 1.4;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 9999;
        }

        #weather-box img {
            width: 32px;
            height: 32px;
            vertical-align: middle;
        }

        /* YouTube Butonu */
        #youtubeBtn {
            position: fixed;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            box-shadow: 0 0 15px red;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            z-index: 9999;
            animation: pulseYT 2s infinite;
        }

        @keyframes pulseYT {
            0% { box-shadow: 0 0 5px red; }
            50% { box-shadow: 0 0 20px red; }
            100% { box-shadow: 0 0 5px red; }
        }
    </style>
</head>
<body>

    <div id="introImage">
        </div>

    <div id="countdownScreen">
        <div id="countdown"></div>
        <div id="message"></div>
    </div>

    <button id="startBtn">EKRANI TIKLA WEBCAM İLE DOĞA İZLE MÜZİK DİNLE. TV İZLE</button>

    <div id="player1" class="player"></div>
    <div id="player2" class="player"></div>

    <button id="closeBtn">KAPAT</button>

    <div id="sloganText">ALİ YANGÖZ DOĞAYI SEVİYOR YA SİZ...</div>

    <audio id="audioPlayer"></audio>
    <button id="musicControl">🎵 Müziği Aç</button>

    <audio id="nature-sound" preload="auto"></audio>
    <div id="nature-controls">
        <button id="play-sound">Doğa Sesini Aç</button>
        <button id="pause-sound" style="display: none;">Doğa Sesini Kapat</button>
    </div>

    <div id="miniTVContainer">
        <iframe id="miniTV" src="about:blank" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <div id="tvControls">
            <button class="tvBtn" id="channelBtn">Kanal Değiştir</button>
            <button class="tvBtn" id="closeTVBtn">TV Kapat</button>
        </div>
    </div>
    <button id="tvOpenBtn">TV Aç</button>

    <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio> <div id="notTrigger">📝</div>
    <div id="notPanel">
        <textarea id="noteText" placeholder="Notunu yaz..."></textarea>
        <input type="datetime-local" id="alarmTime">
        <button onclick="setAlarm()">⏰ Hatırlat</button>
        <button onclick="saveNote()">💾 Kaydet</button>
        <button onclick="closePanel()">❌ Kapat</button>
    </div>

    <div id="weather-box">Yükleniyor...</div>

    <div id="youtubeBtn" title="YouTube Kanalını Aç">▶️</div>

    <script>
        // YouTube IFrame Player API'sini yükle
        // Bu, API hazır olduğunda onYouTubeIframeAPIReady fonksiyonunu çağıracaktır.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // --- Sabitler ve Değişkenler ---
        const videoIds = [
            "g4CmWNxgsic", "LCGYWfbyBWc", "Fw9hgttWzIg", "RmP5eN7gQ6A", "CcnlJI_UXyM", "hFr5w9KLEA4",
            "DsNtwGJXTTs", "FrULPuxyhWE", "Li3Dvqlo5uE", "wBVq_Qoegmo", "1nVFCfRlqRo", "oHbMM9JfCs",
            "Ftm3QRR0YV0", "IIPvs--98sc", "daqB3i9WYIY", "3xGg1HJ8cso", "H8UO0sJvWDw", "czoEAKX9aaM",
            "D1VM6V6wmU0", "EvsLqQS_80E", "8pvXU1aEQZ0", "djEyd01KpNU", "0St2Vey_r1E", "5F0dNX7sFzU",
            "SUXX8nC7RoM", "7uLRpG2c_Eg", "6Ad0iNbv54w", "798qd_SQU3I", "FzdXt1drdp0", "mnCOp-xmpCo",
            "E5T2eHM8tcI", "7w40FtLA4OQ", "ECmjT2D1SzI", "yalfhK84SNU", "F0GOOP82094", "qGfqox0CSrI",
            "4kRzwJXaeIM", "mIPHBwY5aS0", "DHUnz4dyb54", "jzx_n25g3kA", "bKLftRxcy3k", "inDzgZjCxmQ",
            "dIChLG4_WNs", "uAzUAZEKVJI", "1zcIUk66HX4", "QhxCVRJrVHs", "ULoT2kODKlY", "DP9hbJmwbNU",
            "g_L1Ay8P244", "LHtzZf4T7xw", "og8bbxl0iW8", "oI8R4_UG3Fs", "jzx_n25g3kA", "LDv-f0LCrQc",
            "aWglOXp5id0", "Ihr_nwydXi0", "BLvr4K2eiRE", "bEmFpjwMOvs", "YKECtq82zw8", "0FBiyFpV__g",
            "OsH_Z88b1UU", "Hkj9L-HKXJU", "_9E8DuwXCtU", "HskMfIydI-4", "kHwmzef842g", "AAlo3eCPVbk",
            "5e4lsEe4Vew", "V08ET209nvU", "qwjt-gnItvg", "osIj_hLH4Oo", "AkszDPeVaVg", "zC-S84OGXFs"
        ];

        // Buradaki TV kanal ID'lerini güncel YouTube canlı yayın ID'leriyle değiştirmelisiniz.
        // YouTube'un embed politikaları sık değişebilir. Canlı yayınlar için genellikle gömme linkleri (embed URLs) kullanılır.
        // Örnekler:
        // TRT Haber: "UC_uQzI7K-8gR5Jk92o1G25w" (Kanal ID'si, embed için video ID'si lazım)
        // NTV: "UC_uQzI7K-8gR5Jk92o1G25w" (Kanal ID'si)
        // Habertürk: "UC_uQzI7K-8gR5Jk92o1G25w" (Kanal ID'si)
        // Bu yüzden, doğrudan video ID'lerini kullanmak daha güvenli olabilir.
        // Örnek olarak bazı genel yayın akışları (kullanılabilirlik zamana göre değişebilir):
        const tvChannels = [
            "live_video_id_for_trt_haber", // TRT Haber canlı yayın anlık video ID'si
            "live_video_id_for_ntv",      // NTV canlı yayın anlık video ID'si
            "live_video_id_for_haberturk" // Habertürk canlı yayın anlık video ID'si
            // Not: Bu ID'ler zamanla değişir. Canlı yayınları izlemek için güncel video ID'lerini bulup buraya yazmalısınız.
            // Aksi takdirde, TV işlevi çalışmayabilir.
        ];


        let players = {};
        let index = 0;
        let activePlayer = 1;
        let videoChangeTimeout; // setTimeout için bir değişken

        // --- DOM Yüklendiğinde Başlangıç Akışı ---
        document.addEventListener("DOMContentLoaded", () => {
            console.log("DOMContentLoaded: Sayfa yüklendi.");
            // Giriş resmi 5 saniye sonra solarak kaybolur
            setTimeout(() => {
                document.getElementById("introImage").style.opacity = 0;
                console.log("Intro resmi kayboluyor...");
                setTimeout(() => {
                    document.getElementById("introImage").style.display = "none";
                    document.getElementById("countdownScreen").style.display = "flex"; // Geri sayım ekranını göster
                    startCountdown(); // Geri sayımı başlat
                    console.log("Geri sayım başlatıldı.");
                }, 1000); // Opaklık geçişi sonrası tamamen gizle
            }, 5000); // 5 saniye sonra başlat
        });

        function startCountdown() {
            let count = 5;
            const countdownEl = document.getElementById("countdown");
            const messageEl = document.getElementById("message");

            countdownEl.textContent = count;
            messageEl.textContent = "Videolar hazırlanıyor...";

            const timer = setInterval(() => {
                count--;
                countdownEl.textContent = count;

                if (count <= 0) {
                    clearInterval(timer);
                    messageEl.textContent = "Şimdi tıklayabilirsin!";
                    countdownEl.style.display = "none";
                    document.getElementById("countdownScreen").style.display = "none"; // Geri sayım ekranını gizle
                    document.getElementById("startBtn").style.display = "block"; // Başlat butonunu göster
                    document.getElementById("tvOpenBtn").style.display = "block"; // TV Aç butonunu göster
                    console.log("Geri sayım bitti, başlat butonları görünür.");
                }
            }, 1000);
        }

        // --- Buton Olay Dinleyicileri ---
        document.getElementById("startBtn").addEventListener("click", () => {
            console.log("Start butonu tıklandı.");
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("closeBtn").style.display = "block"; // Kapat butonunu göster
            enterFullscreen(document.documentElement);
            startVideoPlayer(); // YouTube oynatıcılarını başlat
            showSlogan(); // Sloganı göster
        });

        document.getElementById("closeBtn").addEventListener("click", () => {
            console.log("Kapat butonu tıklandı.");
            exitFullscreen(); // Tam ekrandan çık
            resetAllFeatures(); // Tüm özellikleri sıfırla ve gizle
            document.getElementById("startBtn").style.display = "block"; // Başlat butonunu tekrar göster
            document.getElementById("closeBtn").style.display = "none"; // Kapat butonunu gizle
            document.getElementById("tvOpenBtn").style.display = "block"; // TV Aç butonunu göster
        });

        function resetAllFeatures() {
            console.log("Tüm özellikler sıfırlanıyor...");
            resetVideoPlayer(); // Video oynatıcıları sıfırla
            document.getElementById("sloganText").style.opacity = 0; // Sloganı gizle
            document.getElementById("miniTVContainer").style.display = "none"; // Mini TV'yi gizle
            document.getElementById("miniTV").src = "about:blank"; // TV iframe içeriğini temizle

            // Müzik ve doğa seslerini kapat
            document.getElementById("audioPlayer").pause();
            document.getElementById("audioPlayer").currentTime = 0;
            document.getElementById("musicControl").textContent = "🎵 Müziği Aç";
            isMusicPlaying = false;

            document.getElementById("nature-sound").pause();
            document.getElementById("nature-sound").currentTime = 0;
            document.getElementById("pause-sound").style.display = "none";
            document.getElementById("play-sound").style.display = "inline-block";

            document.getElementById("notPanel").style.display = "none"; // Not panelini gizle
            // Alarm sesini durdur (eğer çalıyorsa)
            document.getElementById("alarmSound").pause();
            document.getElementById("alarmSound").currentTime = 0;
            console.log("Tüm özellikler sıfırlandı.");
        }

        // --- YouTube Oynatıcı İşlevleri ---
        // onYouTubeIframeAPIReady global olarak tanımlanmalı
        window.onYouTubeIframeAPIReady = function() {
            console.log("onYouTubeIframeAPIReady: YouTube API hazır.");
            // Player 1 oluşturma
            players.player1 = new YT.Player('player1', {
                videoId: '', // Başlangıçta boş bırakılacak
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    mute: 1, // Başlangıçta sesi kapat
                    rel: 0, // İlgili videoları gösterme
                    modestbranding: 1, // YouTube logosunu küçült
                    playsinline: 1 // iOS'ta tam ekranda otomatik oynatma
                },
                events: {
                    onReady: (e) => {
                        console.log("Player1 hazır.");
                        e.target.setVolume(0); // Ses seviyesini sıfırla
                        // Eğer startVideoPlayer buradan çağrılacaksa dikkatli olun.
                        // İlk kez start butonuna basıldığında çağrılmalı.
                    },
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError, // Hata durumunu dinle
                }
            });

            // Player 2 oluşturma
            players.player2 = new YT.Player('player2', {
                videoId: '', // Başlangıçta boş bırakılacak
                playerVars: {
                    autoplay: 0, // Başlangıçta otomatik oynatma kapalı
                    controls: 0,
                    mute: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1
                },
                events: {
                    onReady: (e) => {
                        console.log("Player2 hazır.");
                        e.target.setVolume(0);
                    },
                    onStateChange: onPlayerStateChange,
                    onError: onPlayerError, // Hata durumunu dinle
                }
            });
        };

        function startVideoPlayer() {
            if (videoIds.length === 0) {
                console.warn("Video listesi boş!");
                return;
            }
            // Players objesinin YT.Player instance'ları içerdiğinden emin ol
            if (!players.player1 || !players.player1.loadVideoById) {
                console.error("Player1 henüz başlatılamadı veya YouTube API yüklenmedi.");
                // API'nin yüklenmesini beklemek için bir gecikme ekleyebilirsiniz,
                // veya kullanıcıya bir hata mesajı gösterebilirsiniz.
                // Bu durumda, startVideoPlayer'ı DOMContentLoaded içinde değil, API hazır olduğunda tetiklemek en iyisidir.
                // Ancak mevcut yapıda "Start" butonu basıldığında tetikleniyor.
                // Eğer bu hata sıkça geliyorsa, startVideoPlayer'ı onYouTubeIframeAPIReady içinde çağırmayı düşünebilirsiniz,
                // ama o zaman otomatik başlar, bu da istenmeyebilir.
                return;
            }

            console.log(`İlk video yükleniyor: ${videoIds[index]}`);
            players.player1.loadVideoById(videoIds[index]);
            players.player1.mute();
            players.player1.playVideo();
            document.getElementById('player1').classList.add('active'); // Aktif sınıfını ekle
            scheduleNext(); // Bir sonraki video için zamanlayıcıyı kur
        }

        function onPlayerStateChange(event) {
            console.log(`Player State Changed: ${event.data} for player ${event.target.getIframe().id}`);
            // Video bittiğinde otomatik geçiş yap
            if (event.data === YT.PlayerState.ENDED) {
                console.log("Video bitti, bir sonraki videoya geçiliyor.");
                switchVideo();
            }
        }

        function onPlayerError(event) {
            console.error(`Youtubeer Hatası (${event.data}) for player ${event.target.getIframe().id}`);
            // Hata oluştuğunda normal geçiş zamanlayıcısını iptal et ve hemen bir sonraki videoya geç
            clearTimeout(videoChangeTimeout); // Önemli: Mevcut zamanlayıcıyı iptal et
            switchVideo(); // Hemen bir sonraki videoya geçişi tetikle
        }

        function resetVideoPlayer() {
            console.log("Video oynatıcılar sıfırlanıyor...");
            clearTimeout(videoChangeTimeout); // Tüm zamanlayıcıları temizle
            // Oynatıcıları durdur ve temizle
            if (players.player1 && players.player1.stopVideo) {
                players.player1.stopVideo();
                players.player1.clearVideo(); // Video içeriğini de temizle
            }
            if (players.player2 && players.player2.stopVideo) {
                players.player2.stopVideo();
                players.player2.clearVideo();
            }
            // Aktif sınıfları kaldır
            document.getElementById('player1').classList.remove('active');
            document.getElementById('player2').classList.remove('active');
            index = 0; // İndeksi sıfırla
            activePlayer = 1; // Aktif oynatıcıyı sıfırla
            console.log("Video oynatıcılar sıfırlandı.");
        }

        function scheduleNext() {
            clearTimeout(videoChangeTimeout); // Önceki zamanlayıcıyı temizle
            console.log("scheduleNext: Bir sonraki video için planlama yapılıyor.");

            // Sonraki videoyu arka planda yüklemek için zamanlayıcı (örneğin 5 saniye sonra)
            const nextVideoLoadDelay = 5000;
            setTimeout(() => {
                const nextIndex = (index + 1) % videoIds.length;
                const nextPlayer = activePlayer === 1 ? players.player2 : players.player1;
                if (nextPlayer && nextPlayer.loadVideoById) {
                    console.log(`nextPlayer: Sonraki video (${videoIds[nextIndex]}) yükleniyor.`);
                    nextPlayer.loadVideoById(videoIds[nextIndex]);
                    nextPlayer.mute();
                } else {
                    console.warn("nextPlayer henüz hazır değil veya loadVideoById metodu yok.");
                }
            }, nextVideoLoadDelay);

            // Normal video değişimi için zamanlayıcı (15 saniye sonra aktif oynatıcıyı değiştir)
            const videoSwitchDelay = 15000;
            videoChangeTimeout = setTimeout(() => {
                console.log("videoChangeTimeout tetiklendi, switchVideo çağrılıyor.");
                switchVideo();
            }, videoSwitchDelay);
        }

        function switchVideo() {
            console.log("switchVideo: Videolar arasında geçiş yapılıyor.");
            const nextIndex = (index + 1) % videoIds.length;
            const nextPlayer = activePlayer === 1 ? players.player2 : players.player1;
            const nextDiv = activePlayer === 1 ? document.getElementById("player2") : document.getElementById("player1");
            const currentDiv = activePlayer === 1 ? document.getElementById("player1") : document.getElementById("player2");

            // Önceki aktif oynatıcıyı durdur
            const currentPlayer = activePlayer === 1 ? players.player1 : players.player2;
            if (currentPlayer && currentPlayer.stopVideo) {
                currentPlayer.stopVideo();
            }

            currentDiv.classList.remove("active");
            nextDiv.classList.add("active");

            index = nextIndex;
            activePlayer = activePlayer === 1 ? 2 : 1;

            // Yeni videoyu oynat ve sessize al
            if (nextPlayer && nextPlayer.playVideo) {
                nextPlayer.playVideo();
                nextPlayer.mute();
                console.log(`Yeni aktif video: ${videoIds[index]}`);
            } else {
                console.warn("Yeni oynatıcı henüz hazır değil veya playVideo metodu yok.");
                // Eğer yeni oynatıcı hazır değilse, hata oluşmuş olabilir. Hemen bir sonraki videoya geçmeyi dene.
                setTimeout(switchVideo, 1000);
            }

            // Bir sonraki video için zamanlayıcıyı tekrar kur
            scheduleNext();
        }

            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
            console.log("Tam ekrana geçiş denendi.");
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
            console.log("Tam ekrandan çıkış denendi.");
        }

        const audioPlayer = document.getElementById("audioPlayer");
        const musicControlBtn = document.getElementById("musicControl");
        let isMusicPlaying = false;
        let shuffledSongs = shuffleArray([...turkeySongs]);
        let currentSongIndex = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playNextSong() {
            if (shuffledSongs.length === 0) {
                console.warn("Müzik listesi boş!");
                return;
            }
            audioPlayer.src = shuffledSongs[currentSongIndex];
            audioPlayer.play().catch(error => {
                console.error("Müzik oynatılırken hata:", error);
                // Oynatma hatasında bir sonraki şarkıya geçmeyi dene
                currentSongIndex = (currentSongIndex + 1) % shuffledSongs.length;
                setTimeout(playNextSong, 1000); // 1 saniye sonra tekrar dene
            });
            currentSongIndex = (currentSongIndex + 1) % shuffledSongs.length;
        }

        audioPlayer.addEventListener("ended", playNextSong);

        musicControlBtn.addEventListener("click", () => {
            if (!isMusicPlaying) {
                playNextSong();
                musicControlBtn.textContent = "⏸ Müziği Kapat";
                isMusicPlaying = true;
                console.log("Müzik başlatıldı.");
            } else {
                audioPlayer.pause();
                musicControlBtn.textContent = "🎵 Müziği Aç";
                isMusicPlaying = false;

            "relaxing-rain-and-birds-6-minutes-52191.mp3", "soft-wind-314945.mp3",
            "soft-wind-318856.mp3", "waterfall-176958 (1).mp3", "waterfall-176958.mp3",
            "water-splashing-108887.mp3", "tui-birdsong-new-zealand-31660.mp3",

        ];

        playSoundBtn.addEventListener("click", () => {
            const randomIndex = Math.floor(Math.random() * natureSounds.length);

            playSoundBtn.style.display = "none";
            pauseSoundBtn.style.display = "inline-block";

        pauseSoundBtn.addEventListener("click", () => {
            natureAudio.pause();
            natureAudio.currentTime = 0;
            pauseSoundBtn.style.display = "none";
            playSoundBtn.style.display = "inline-block";
            console.log("Doğa sesi durduruldu.");
        });

        let currentTVChannel = 0;
        const tvFrame = document.getElementById("miniTV");
        const tvContainer = document.getElementById("miniTVContainer");
        const tvOpenBtn = document.getElementById("tvOpenBtn");
        const channelBtn = document.getElementById("channelBtn");
        const closeTVBtn = document.getElementById("closeTVBtn");

        channelBtn.addEventListener("click", () => {
            currentTVChannel = (currentTVChannel + 1) % tvChannels.length;
            const tvVideoId = tvChannels[currentTVChannel];
            // TV için YouTube video ID'si kullanılıyorsa:
            tvFrame.src = `https://www.youtube.com/embed/${tvVideoId}?autoplay=1&controls=1&mute=0&rel=0&modestbranding=1&playsinline=1`;

        });

        closeTVBtn.addEventListener("click", () => {
            tvContainer.style.display = "none";
            tvOpenBtn.style.display = "block";
            tvFrame.src = "about:blank"; // TV'yi kapatırken iframe içeriğini temizle

            notPanel.style.display = notPanel.style.display === 'flex' ? 'none' : 'flex';

        }

        function setAlarm() {
            const alarmTime = new Date(alarmTimeInput.value).getTime();
            if (!alarmTime || isNaN(alarmTime)) {
                alert('Geçerli bir tarih ve saat seçiniz!');
                return;
            }
            const now = Date.now();
            const delay = alarmTime - now;

            if (delay < 0) {
                alert('Geçmiş bir zaman seçilemez!');
                return;
            }

            setTimeout(() => {
                alarmSound.play().catch(e => console.error("Alarm sesi oynatma hatası:", e));

        const apiKey = '77fe7ca2c5710d0b9e4b56b12b6b679e'; // Kendi OpenWeatherMap API anahtarınız
        const cities = [
            "Kutahya", "Karabuk", "Usak", "Istanbul", "Ankara",
            "Izmir", "Adana", "Antalya", "Samsun", "Eskisehir"
        ];
        let currentCityIndex = 0;
        const weatherBox = document.getElementById('weather-box');

        async function fetchWeather(city) {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city},TR&units=metric&lang=tr&appid=${apiKey}`;
            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.cod !== 200) {
                    throw new Error(data.message || "Hava durumu verisi alınamadı.");
                }

                const temp = Math.round(data.main.temp);
                const description = data.weather[0].description;
                const icon = data.weather[0].icon;
                const cityName = data.name;

                weatherBox.innerHTML = `
                    <strong>${cityName}</strong><br>
                    ${description}<br>
                    Sıcaklık: ${temp}°C<br>
                    <img src="https://openweathermap.org/img/wn/${icon}.png" alt="${description}" />
                `;
                console.log(`Hava durumu güncellendi: ${cityName}`);
            } catch (error) {
                console.error("Hava durumu bilgisi alınamadı:", error);
                weatherBox.innerHTML = `Hata: Hava durumu yüklenemedi.`;
            }
        }

        function updateWeather() {
            const city = cities[currentCityIndex];
            fetchWeather(city);
            currentCityIndex = (currentCityIndex + 1) % cities.length;
