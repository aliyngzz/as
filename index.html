<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doğa Sayfası - Video Sistemi</title>
  <style>
    body {
      background: linear-gradient(#0a0f13, #1e2b33);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 40px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #9efc9e;
      text-shadow: 1px 1px 5px #333;
    }

    button {
      margin: 10px;
      padding: 14px 28px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      background-color: #27ae60;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background-color: #219150;
    }

    .player-container {
      display: none;
      margin-top: 30px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>🌿 Doğa Sayfası | Video Sistemi</h1>

  <button onclick="showYouTubeWebcam()">🎥 WEBCAM VİDEOLARI</button>
  <button onclick="showMP4Videos()">📼 MP4 VİDEOLARI</button>

  <!-- YouTube Player 1 (Webcam) -->
  <div class="player-container" id="youtubePlayer1"></div>

  <!-- YouTube Player 2 (MP4 gibi videolar) -->

  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>

    "mnCOp-xmpCo", "E5T2eHM8tcI", "7w40FtLA4OQ", "ECmjT2D1SzI", "yalfhK84SNU", "F0GOOP82094", "qGfqox0CSrI", "4kRzwJXaeIM", "mIPHBwY5aS0", "DHUnz4dyb54",  "jzx_n25g3kA",  "bKLftRxcy3k",  "inDzgZjCxmQ", "dIChLG4_WNs", "uAzUAZEKVJI", "1zcIUk66HX4", "QhxCVRJrVHs", "ULoT2kODKlY", "DP9hbJmwbNU", "g_L1Ay8P244", "LHtzZf4T7xw", "og8bbxl0iW8", "oI8R4_UG3Fs", "jzx_n25g3kA", "LDv-f0LCrQc", "DsNtwGJXTTs", "aWglOXp5id0", "Ihr_nwydXi0", "BLvr4K2eiRE", "bEmFpjwMOvs", "YKECtq82zw8", "0FBiyFpV__g", "OsH_Z88b1UU", "Hkj9L-HKXJU", "_9E8DuwXCtU", "mnCOp-xmpCo", "HskMfIydI-4", "kHwmzef842g", "AAlo3eCPVbk", "5e4lsEe4Vew", "V08ET209nvU", "qwjt-gnItvg", "osIj_hLH4Oo", "AkszDPeVaVg", "zC-S84OGXFs"

    // YouTube API yüklenince bu fonksiyon çağrılır
    function onYouTubeIframeAPIReady() {
      player1 = new YT.Player("youtubePlayer1", {
        height: "360",
        width: "640",
        videoId: videoIds[currentIndex],
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange1,
          onError: onPlayerError1
        }
      });

      player2 = new YT.Player("youtubePlayer2", {
        height: "360",
        width: "640",
        videoId: videoIds[currentIndex],
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange2,
          onError: onPlayerError2
        }
      });
    }

    // Oynatıcı hazır olunca çalışır
    function onPlayerReady(event) {
      event.target.playVideo();
    }

    // Player1 bitince sıradakine geç
    function onPlayerStateChange1(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNextVideo(player1);
      }
    }

    // Player2 bitince sıradakine geç
    function onPlayerStateChange2(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNextVideo(player2);
      }
    }

    // Player1 hata aldığında anında geç
    function onPlayerError1(event) {
      console.warn("Player1 hatalı video! Hemen geçiliyor...");
      playNextVideo(player1);
    }

    // Player2 hata aldığında anında geç
    function onPlayerError2(event) {
      console.warn("Player2 hatalı video! Hemen geçiliyor...");
      playNextVideo(player2);
    }

    // Bir sonraki videoya geçiş fonksiyonu
    function playNextVideo(player) {
      currentIndex++;
      if (currentIndex >= videoIds.length) currentIndex = 0;
      player.loadVideoById(videoIds[currentIndex]);
    }

    // Webcam butonuna tıklanınca
    function showYouTubeWebcam() {
      aktifPlayer = 1;
      currentIndex = 0;
      document.getElementById("youtubePlayer1").style.display = "flex";
      document.getElementById("youtubePlayer2").style.display = "none";
      player1.loadVideoById(videoIds[currentIndex]);
    }

    // MP4 butonuna tıklanınca
    function showMP4Videos() {
      aktifPlayer = 2;
      currentIndex = 0;
      document.getElementById("youtubePlayer1").style.display = "none";
      document.getElementById("youtubePlayer2").style.display = "flex";
      player2.loadVideoById(videoIds[currentIndex]);
    }
  </script>
