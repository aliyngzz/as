<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Gizli Yükleme | Sadece Sağlam Video</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background-color: black;
    }
    #mainPlayer, #testPlayer {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: none;
    }
    #mainPlayer {
      z-index: 10;
      display: block;
    }
    #noteText {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 300px;
      height: 150px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<textarea id="noteText" placeholder="Bozuk videolar buraya yazılır..."></textarea>
<div id="mainPlayer"></div>
<div id="testPlayer" style="visibility: hidden;"></div>

<script>
  const videoIds = [
   "V08ET209nvU",
"eT_W9pSC3mY",
"17L1ahq27ro",

"Gd9d4q6WvUY",

"aNxF7t9-HgI",
    "g4CmWNxgsic", "LCGYWfbyBWc", "Fw9hgttWzIg", "RmP5eN7gQ6A",
    "CcnlJI_UXyM", "hFr5w9KLEA4", "DsNtwGJXTTs", "FrULPuxyhWE",
    "Li3Dvqlo5uE", "wBVq_Qoegmo", "1nVFCfRlqRo", "oHbMM9JfCs",
    "Ftm3QRR0YV0", "IIPvs--98sc", "daqB3i9WYIY", "3xGg1HJ8cso",
    "H8UO0sJvWDw", "czoEAKX9aaM", "D1VM6V6wmU0", "EvsLqQS_80E",
    "8pvXU1aEQZ0", "djEyd01KpNU", "0St2Vey_r1E", "5F0dNX7sFzU",
    "SUXX8nC7RoM", "7uLRpG2c_Eg", "6Ad0iNbv54w", "798qd_SQU3I",
    "FzdXt1drdp0", "mnCOp-xmpCo", "E5T2eHM8tcI", "7w40FtLA4OQ",
    "ECmjT2D1SzI", "yalfhK84SNU", "F0GOOP82094", "qGfqox0CSrI",
    "4kRzwJXaeIM", "mIPHBwY5aS0", "DHUnz4dyb54", "jzx_n25g3kA"
  ];

  let currentIndex = 0;
  let testPlayer, mainPlayer;

  function loadYouTubeAPI() {
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  }

  function onYouTubeIframeAPIReady() {
    tryNextVideo();
  }

  function tryNextVideo() {
    if (currentIndex >= videoIds.length) {
      document.getElementById("noteText").value += "\nHiç geçerli video bulunamadı.";
      return;
    }

    const videoId = videoIds[currentIndex];

    if (testPlayer) testPlayer.destroy();
    if (mainPlayer) mainPlayer.destroy();

    testPlayer = new YT.Player('testPlayer', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        mute: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0
      },
      events: {
        'onReady': (event) => {
          event.target.playVideo();
          setTimeout(() => {
            const state = event.target.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
              showMainPlayer(videoId);
            } else {
              logBrokenVideo(videoId);
            }
          }, 2000);
        },
        'onError': () => {
          logBrokenVideo(videoId);
        }
      }
    });
  }

  function showMainPlayer(videoId) {
    mainPlayer = new YT.Player('mainPlayer', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        mute: 1,
        controls: 0,
        modestbranding: 1,
        rel: 0
      }
    });
    document.getElementById("mainPlayer").style.display = "block";
  }

  function logBrokenVideo(id) {
    document.getElementById("noteText").value += `\nBozuk video: ${id}`;
    currentIndex++;
    tryNextVideo();
  }

  loadYouTubeAPI();
</script>

</body>
</html>
