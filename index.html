let player, currentVideoId = null;
const tv = document.getElementById("transitionVideo");
let autoSwitchEnabled = true;

// Müzik çalar
const musicPlayer=document.getElementById("musicPlayer");
let musicIndex=Math.floor(Math.random()*turkeySongs.length);
musicPlayer.src=turkeySongs[musicIndex];
musicPlayer.addEventListener('ended',()=>{
  musicIndex=(musicIndex+1)%turkeySongs.length;
  musicPlayer.src=turkeySongs[musicIndex];
  musicPlayer.play();
});

// Butonlar
document.getElementById('fullscreenBtn').addEventListener('click',()=>{ 
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); } 
  else{ document.exitFullscreen(); } 
});
document.getElementById('musicBtn').addEventListener('click',()=>{
  if(musicPlayer.paused){ musicPlayer.play(); } else{ musicPlayer.pause(); }
});

// Buton gizle/göster
let hideTimeout;
function hideButtons(){ document.getElementById('fullscreenBtn').classList.add('hidden'); document.getElementById('musicBtn').classList.add('hidden'); }
function showButtons(){ 
    document.getElementById('fullscreenBtn').classList.remove('hidden'); 
    document.getElementById('musicBtn').classList.remove('hidden'); 
    clearTimeout(hideTimeout); 
    hideTimeout=setTimeout(hideButtons,20000); 
}
['mousemove','touchstart','pointerdown'].forEach(evt=>{
  document.addEventListener(evt,showButtons,{passive:true});
  document.getElementById('playerWrapper').addEventListener(evt,showButtons,{passive:true});
});
showButtons();

// Resize
function resizePlayer(){
    const wrapper=document.getElementById('playerWrapper');
    const iframe=wrapper.querySelector('iframe');
    if(!iframe) return;
    const w=wrapper.offsetWidth, h=wrapper.offsetHeight, ratio=16/9;
    if(w/h>ratio){ iframe.style.width=h*ratio+'px'; iframe.style.height=h+'px'; }
    else{ iframe.style.width=w+'px'; iframe.style.height=w/ratio+'px'; }
}
window.addEventListener('resize',resizePlayer);

// YouTube helpers
function getRandomVideoId(){ 
    let id; do{ id = videoIds[Math.floor(Math.random()*videoIds.length)]; } while(id===currentVideoId);
    return id;
}

function playNextVideo(){
  if(!autoSwitchEnabled) return;
  // MP4 geçiş
  tv.src = transitionVideos[Math.floor(Math.random()*transitionVideos.length)];
  tv.style.opacity=1;
  tv.currentTime=0;
  tv.play();

  // Hazırlıkta yeni YouTube video
  const nextId = getRandomVideoId();
  const tempPlayer = new YT.Player('player',{videoId:nextId, playerVars:{autoplay:1,controls:0,mute:1,rel:0,playsinline:1},
      events:{onReady:(e)=>{
          // 6 saniye MP4 sonrası göster
          setTimeout(()=>{
            currentVideoId = nextId;
            tv.style.opacity=0;
            resizePlayer();
            player.loadVideoById(currentVideoId);
            player.mute();
            player.playVideo();
          },6000);
          document.getElementById("loadingOverlay").style.display="none";
      }, onError:()=>{ playNextVideo(); } }
  });
  player = tempPlayer;

  // 20 saniye sonra tekrar döngü
  setTimeout(()=>{ if(autoSwitchEnabled) playNextVideo(); },26000); // 6s MP4 + 20s YouTube
}

// Başlat
function startCycle(){
  // İlk MP4 başlasın
  tv.src = transitionVideos[Math.floor(Math.random()*transitionVideos.length)];
  tv.style.opacity=1;
  tv.currentTime=0;
  tv.play();

  // İlk YouTube arka planda hazırlanacak ama görünmeyecek
  const firstId = getRandomVideoId();
  currentVideoId = firstId;
  player = new YT.Player('player',{
      videoId:firstId,
      playerVars:{autoplay:1,controls:0,mute:1,rel:0,playsinline:1},
      events:{
        onReady:(e)=>{
          // İlk 6 saniye boyunca iframe görünmesin
          const iframe = document.querySelector('#player iframe');
          if(iframe){ iframe.style.opacity = "0"; }

          setTimeout(()=>{
            // 6 saniye dolunca MP4 kaybolsun, YouTube görünsün
            tv.style.opacity=0;
            if(iframe){ iframe.style.opacity = "1"; }
            resizePlayer();
            player.playVideo();
          },6000);

          // 26 saniyede (6+20) döngüye geç
          setTimeout(()=>{ if(autoSwitchEnabled) playNextVideo(); },26000);

          document.getElementById("loadingOverlay").style.display="none";
        },
        onError:()=>{ playNextVideo(); }
      }
  });
}
// Load YouTube API
const tag=document.createElement('script');
tag.src="https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady(){ startCycle(); }
