<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: black; overflow: hidden;
  }
#player {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: black;
}

#player iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: none;
}
  /* Butonlar */
  .btn {
    position: fixed;
    z-index: 999;
    border: 2px solid white;
    border-radius: 50%;
    width: 60px; height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: transform 0.3s, opacity 0.5s;
    opacity: 1;

    /* Gökkuşağı iç dolgu */
    background: linear-gradient(
      270deg,
      #ff0000, #ff7f00, #ffff00,
      #00ff00, #0000ff, #4b0082, #8f00ff
    );
    background-size: 400% 400%;
    animation: btnRainbow 6s ease infinite;
  }

  .btn:hover {
    transform: scale(1.1);
  }

  /* Gökkuşağı animasyonu */
  @keyframes btnRainbow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #fullscreenBtn { bottom: 20px; right: 20px; top: auto; }
  #musicBtn { bottom: 20px; left: 20px; top: auto; }
  audio { display: none; }

  /* Yükleme ekranı */
  #loadingOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 998;
    background: linear-gradient(
      270deg,
      #ff0000, #ff7f00, #ffff00,
      #00ff00, #0000ff, #4b0082, #8f00ff
    );
    background-size: 1400% 1400%;
    animation: rainbowMove 8s ease infinite;
  }
  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .btn.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>

  let player;
  let videoTimer;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: getRandomVideo(),
      playerVars: { autoplay: 1, controls: 0, mute: 1, rel: 0, playsinline: 1 },
      events: {
        onReady: onPlayerReady,
        onError: onPlayerError,
        onStateChange: onPlayerStateChange
      }
    });
  }

  function getRandomVideo() {
    return videoIds[Math.floor(Math.random() * videoIds.length)];
  }

  function playNextVideo() {
    clearInterval(videoTimer);
    player.loadVideoById(getRandomVideo());
    startVideoRotation();
  }

  function onPlayerError() {
    playNextVideo();
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      playNextVideo();
    }
  }

  function startVideoRotation() {
    clearInterval(videoTimer);
    videoTimer = setInterval(playNextVideo, 40000); // 40 saniye
  }

  function onPlayerReady(event) {
    player.setPlaybackQuality('highres');
    player.playVideo();
    startVideoRotation();
    showButtons();
    document.getElementById("loadingOverlay").style.display = "none";
  }

  // YouTube API yükle
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // Tam ekran butonu
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  // Müzik butonu
  const musicPlayer = document.getElementById('musicPlayer');
  let musicIndex = Math.floor(Math.random() * turkeySongs.length);
  musicPlayer.src = turkeySongs[musicIndex];

  musicPlayer.addEventListener('ended', () => {
    musicIndex = (musicIndex + 1) % turkeySongs.length;
    musicPlayer.src = turkeySongs[musicIndex];
    musicPlayer.play();
  });

  document.getElementById('musicBtn').addEventListener('click', () => {
    if (musicPlayer.paused) {
      musicPlayer.play();
    } else {
      musicPlayer.pause();
    }
  });

  // Butonları gizle/göster
  let hideTimeout;
  function hideButtons() {
    document.getElementById('fullscreenBtn').classList.add('hidden');
    document.getElementById('musicBtn').classList.add('hidden');
  }
  function showButtons() {
    document.getElementById('fullscreenBtn').classList.remove('hidden');
    document.getElementById('musicBtn').classList.remove('hidden');
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(hideButtons, 20000);
  }
  ['mousemove','touchstart','pointerdown'].forEach(evt => {
    document.addEventListener(evt, showButtons, { passive: true });
    document.getElementById('player').addEventListener(evt, showButtons, { passive: true });
  });
  showButtons();




function resizePlayer() {
    const playerDiv = document.getElementById('player');
    const iframe = playerDiv.querySelector('iframe');
    if (!iframe) return;

    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const windowRatio = windowWidth / windowHeight;
    const videoRatio = 16 / 9;

    if (windowRatio > videoRatio) {
        // ekran yatay → yükseklik tam, genişlik taşacak
        iframe.style.width = (windowHeight * videoRatio) + 'px';
        iframe.style.height = windowHeight + 'px';
    } else {
        // ekran dik → genişlik tam, yükseklik taşacak
        iframe.style.width = windowWidth + 'px';
        iframe.style.height = (windowWidth / videoRatio) + 'px';
    }
}

// iframe oluşturulduktan sonra çağır
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: getRandomVideo(),
    playerVars: { autoplay: 1, controls: 0, mute: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: (event) => {
        resizePlayer();
        event.target.playVideo();
      },
      onError: () => playNextVideo(),
      onStateChange: onPlayerStateChange
    }
  });
}

// pencere boyutu değişince yeniden hesapla
window.addEventListener('resize', resizePlayer);
