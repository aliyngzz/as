<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doğa Temalı Sayfa</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
    }
    video#bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    #ytPlayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      display: none;
    }
    #buttons {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
    .button {
      background-color: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid white;
      padding: 10px;
      margin: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    #notePanel {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px;
      font-size: 12px;
    }
    #weatherBox {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px;
      font-size: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>

<video id="bgVideo" autoplay muted loop></video>
<div id="ytPlayer"></div>
<div id="testContainer" style="display:none;"></div>

<div id="buttons">
  <div class="button" onclick="playMp4Fallback()">MP4 Videolar</div>
  <div class="button" onclick="playNatureSounds()">Doğa Sesleri</div>
  <div class="button" onclick="playMusic()">Türkü</div>
</div>

<div id="notePanel">
  <textarea id="noteText" rows="5" cols="40" readonly>Hatalı video ID'leri burada listelenecek...</textarea>
</div>

<div id="weatherBox">
  <div id="weatherInfo">Hava durumu yükleniyor...</div>
</div>

<script>
const mp4Videos = ['']; // MP4 video yollarını buraya ekle
const videoIds = ['']; // YouTube video ID'lerini buraya ekle
let validVideoIds = [], badVideoIds = [], testIndex = 0;
let mp4Index = 0;

const bgVideo = document.getElementById('bgVideo');
bgVideo.src = mp4Videos[0] || '';
bgVideo.onended = () => {
  mp4Index = (mp4Index + 1) % mp4Videos.length;
  bgVideo.src = mp4Videos[mp4Index];
  bgVideo.play();
};

function playMp4Fallback() {
  document.getElementById('ytPlayer').style.display = 'none';
  bgVideo.style.display = 'block';
  bgVideo.play();
}

function playNatureSounds() {
  // Doğa sesi mp3 oynatıcı kodlarını buraya ekle
}

function playMusic() {
  // Türkü mp3 oynatıcı kodlarını buraya ekle
}

function logBadVideo(id) {
  const note = document.getElementById('noteText');
  if (!note.value.includes(id)) {
    note.value += `\nHatalı Video ID: ${id}`;
    badVideoIds.push(id);
  }
}

function testVideoId(id, callback) {
  const container = document.createElement('div');
  container.style.display = 'none';
  document.body.appendChild(container);
  const player = new YT.Player(container, {
    height: '0', width: '0', videoId: id,
    events: {
      'onReady': event => {
        const state = event.target.getPlayerState();
        if (state === -1) logBadVideo(id);
        else validVideoIds.push(id);
        player.destroy(); container.remove(); callback();
      },
      'onError': () => {
        logBadVideo(id);
        player.destroy(); container.remove(); callback();
      }
    }
  });
}

function testYouTubeVideosSequentially() {
  if (testIndex >= videoIds.length) return;
  const id = videoIds[testIndex];
  if (badVideoIds.includes(id) || validVideoIds.includes(id)) {
    testIndex++;
    testYouTubeVideosSequentially();
    return;
  }
  testVideoId(id, () => {
    testIndex++;
    setTimeout(testYouTubeVideosSequentially, 500);
  });
}

function startYouTubePlayback() {
  if (validVideoIds.length === 0) return playMp4Fallback();
  const ytDiv = document.getElementById('ytPlayer');
  ytDiv.style.display = 'block';
  bgVideo.style.display = 'none';
  let index = 0;
  const player = new YT.Player('ytPlayer', {
    height: '100%', width: '100%', videoId: validVideoIds[0],
    events: {
      'onReady': () => {
        function playNext() {
          if (index >= validVideoIds.length) index = 0;
          player.loadVideoById(validVideoIds[index]);
          index++;
          setTimeout(playNext, 10000);
        }
        playNext();
      }
    }
  });
}

window.addEventListener('load', () => {
  playMp4Fallback();
  testYouTubeVideosSequentially();
  setTimeout(() => {
    bgVideo.pause();
    startYouTubePlayback();
  }, 300000);
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
