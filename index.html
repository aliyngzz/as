<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tam Ekran Video + Müzik</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  #videoContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 0;
  }
  iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 177.78vh; /* 16:9 oranı için genişlik */
    height: 100vh;
    transform: translate(-50%, -50%);
  }
  /* Ekran çok dar ise yükseklik bazlı boyutlandır */
  @media (max-aspect-ratio: 16/9) {
    iframe {
      width: 100vw;
      height: 56.25vw; /* 16:9 oranı için yükseklik */
    }
  }
  #controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
  }
  button {
    padding: 10px 15px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="videoContainer">
  <iframe id="ytPlayer"
    src="https://www.youtube.com/embed/VIDEO_ID_1?autoplay=1&mute=1&controls=0&showinfo=0&modestbranding=1&rel=0&loop=1&playlist=VIDEO_ID_1"
    frameborder="0"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</div>

<div id="controls">
  <button id="musicBtn">Müziği Aç</button>
</div>

<audio id="bgMusic" loop>
  <source src="MUSIC_FILE_1.mp3" type="audio/mpeg">
</audio>

<script>
  const videos = [
    "VIDEO_ID_1",
    "VIDEO_ID_2",
    "VIDEO_ID_3"
  ];

  const musics = [
    "MUSIC_FILE_1.mp3",
    "MUSIC_FILE_2.mp3",
    "MUSIC_FILE_3.mp3"
  ];

  let videoIndex = 0;
  let musicIndex = 0;
  const player = document.getElementById("ytPlayer");
  const bgMusic = document.getElementById("bgMusic");
  const musicBtn = document.getElementById("musicBtn");

  // Video değiştir (örnek: 30 saniyede bir)
  setInterval(() => {
    videoIndex = (videoIndex + 1) % videos.length;
    player.src = `https://www.youtube.com/embed/${videos[videoIndex]}?autoplay=1&mute=1&controls=0&showinfo=0&modestbranding=1&rel=0&loop=1&playlist=${videos[videoIndex]}`;
  }, 30000);

  // Müzik butonu
  musicBtn.addEventListener("click", () => {
    if (bgMusic.paused) {
      bgMusic.src = musics[musicIndex];
      bgMusic.play();
      musicBtn.textContent = "Müziği Kapat";
    } else {
      bgMusic.pause();
      musicBtn.textContent = "Müziği Aç";
    }
  });
</script>

</body>
</html>
