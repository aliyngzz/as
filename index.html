function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

<script>

 const apiKey = '77fe7ca2c5710d0b9e4b56b12b6b679e';
  const cities = [
    "Kutahya", "Karabuk", "Usak", "Istanbul", "Ankara",
    "Izmir", "Adana", "Antalya", "Samsun", "Eskisehir"
  ];

  let currentCityIndex = 0;
  const weatherBox = document.getElementById('weather-box');

  async function fetchWeather(city) {
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city},TR&units=metric&lang=tr&appid=${apiKey}`;
    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.cod !== 200) {
        throw new Error(data.message);
      }

      const temp = Math.round(data.main.temp);
      const description = data.weather[0].description;
      const icon = data.weather[0].icon;
      const cityName = data.name;

      weatherBox.innerHTML = `
        <strong>${cityName}</strong><br>
        ${description}<br>
        Sıcaklık: ${temp}°C<br>
        <img src="https://openweathermap.org/img/wn/${icon}.png" alt="${description}" />
      `;
    } catch (error) {
      weatherBox.innerHTML = `Hata: ${error.message}`;
    }
  }

  function updateWeather() {
    const city = cities[currentCityIndex];
    fetchWeather(city);
    currentCityIndex = (currentCityIndex + 1) % cities.length;
  }

  // İlk çağırma
  updateWeather();
  // 5 saniyede bir güncelle
  setInterval(updateWeather, 5000);
</script>

<script>

    // YouTube videosu çalışıyorsa MP4 oynatma
    if (players && (
      players.player1?.getPlayerState() === 1 ||
      players.player2?.getPlayerState() === 1
    )) {
      return; // YouTube çalışıyorsa MP4'e geçme
    }

    const mp4 = document.getElementById("mp4Player");

    // Liste bitti mi? Baştan karıştır ve sıfırla
    if (currentMp4Index >= mp4Videos.length) {
      shuffleArray(mp4Videos); // 🔁 tekrar karıştır
      currentMp4Index = 0;
    }

    // Mevcut videoyu ayarla ve başlat
    mp4.pause();
    mp4.removeAttribute('src');
    mp4.load();

    mp4.src = mp4Videos[currentMp4Index++];
    mp4.playbackRate = 1.0;
    mp4.style.display = "block";
    mp4.play();

    // MP4 video bittiğinde sıradakine geç
   mp4.onended = () => {
  skipToNext(); // ✅ MP4 bitti → YouTube’a geç
};
 }
  function stopMp4() {
    const mp4 = document.getElementById("mp4Player");

    mp4.removeAttribute('src');
    mp4.load();
    mp4.style.display = "none";
  }
</script>

<script>
  function loadVideo(player, videoId, playerDivId) {
    const div = document.getElementById(playerDivId);
    div.classList.remove("active");

    try {
      player.loadVideoById(videoId);
      player.mute();

      let attempt = 0;
      const maxAttempts = 2;

      const checkInterval = setInterval(() => {
        const state = player.getPlayerState();

        // Yalnızca gerçek oynatma (state === 1) geldiğinde göster
        if (state === 1) {
          clearInterval(checkInterval);
          div.classList.add("active");
          stopMp4();  // YouTube başarılıysa MP4’ü kapat
        } else {
          attempt++;
          if (attempt >= maxAttempts) {
            clearInterval(checkInterval);
            logBadVideo(videoId);
            playMp4Fallback(); // YouTube başarısızsa MP4’ü çal
            skipToNext();
          }
        }
    }, 500);
    } catch (err) {
      logBadVideo(videoId);
      playMp4Fallback();
      skipToNext();
    }
  }

</script>

<script>
  const badVideoIds = [];

  // Sayfa yüklenince hafızadakileri yükle
  window.addEventListener('load', loadBadIds);

  function loadBadIds() {
    const stored = localStorage.getItem('badVideoIds');
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          badVideoIds.push(...parsed);
        }
      } catch (e) {
        console.warn("Kayıtlı hatalı video verisi okunamadı:", e);
      }
    }
  }

  function saveBadIds() {
    localStorage.setItem('badVideoIds', JSON.stringify(badVideoIds));
  }

  function logBadVideo(badId) {
    const note = document.getElementById("noteText");
    const currentNote = note.value;
    if (!currentNote.includes(badId)) {
      note.value += `\nHatalı Video ID: ${badId}`;
    }
    if (!badVideoIds.includes(badId)) {
      badVideoIds.push(badId);
      saveBadIds();
    }
  }
</script>
