<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Sayfası</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: black;
    }

    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      padding: 20px 40px;
      background: rgba(0, 128, 0, 0.8);
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      z-index: 1000;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* Animasyonlar */
    .fade { animation: fadeIn 1s ease; }
    .slide { animation: slideIn 1s ease; }
    .zoom  { animation: zoomIn 1s ease; }
    .rotate { animation: rotateIn 1s ease; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    @keyframes zoomIn {
      from { transform: scale(1.4); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes rotateIn {
      from { transform: rotateY(90deg); opacity: 0; }
      to { transform: rotateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <button id="startButton">🎬 Video Başlat</button>
  <iframe id="video1" allow="autoplay" style="display: none;"></iframe>
  <iframe id="video2" allow="autoplay" style="display: none;"></iframe>

  <script>
    const videoIds = [ 
      "V08ET209nvU", "eT_W9pSC3mY", "17L1ahq27ro", "OteVW3af3BU", "Gd9d4q6WvUY",
      "sgtA6GUJk2I", "NqOmHpwMUxs", "FrULPuxyhWE", "V_I168MM-ik", "OYuD6HIxcXc",
      "xBBRLWF0mM", "Lic2fD18wnw", "pW_S5RTdnSQ", "z6BNMoj9Pyo", "EoARdUpNjJ8",
      "aNxF7t9-HgI", "g4CmWNxgsic", "LCGYWfbyBWc", "Fw9hgttWzIg", "RmP5eN7gQ6A"
    ];

    let index = 0;
    let current = "video1";
    let next = "video2";

    const animations = ["fade", "slide", "zoom", "rotate"];
    const getRandomAnim = () => animations[Math.floor(Math.random() * animations.length)];

    function playLoop() {
      const v1 = document.getElementById(current);
      const v2 = document.getElementById(next);

      const id1 = videoIds[index % videoIds.length];
      const id2 = videoIds[(index + 1) % videoIds.length];

      const animClass = getRandomAnim();
      v1.className = animClass;
      v1.src = `https://www.youtube.com/embed/${id1}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0`;
      v1.style.display = "block";

      setTimeout(() => {
        v2.src = `https://www.youtube.com/embed/${id2}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0`;
      }, 15000);

      setTimeout(() => {
        v1.style.display = "none";
        v1.src = "";
        v1.className = "";
        [current, next] = [next, current];
        index++;
        playLoop();
      }, 30000);
    }

    document.getElementById("startButton").addEventListener("click", () => {
      document.getElementById("startButton").style.display = "none";
      playLoop();
    });
  </script>
</body>
</html>
